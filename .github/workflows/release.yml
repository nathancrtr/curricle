# Publish the container image for a tagged release.
#
# Tags are the only trigger. An image that moved every time `main` moved
# would make "the version natto is running" a question nobody could answer
# from the repository, and the deployment pins an exact tag precisely so that
# question always has an answer.
#
# linux/amd64 only: the one host that runs this is x86_64. Adding arm64 means
# QEMU emulation in the runner for a platform nothing currently deploys to,
# so it stays off until something needs it.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The suite is not re-run here — `tests.yml` already gated the commit
      # this tag points at. What is worth re-checking at release time is the
      # thing tests.yml cannot see: that the image builds and the course that
      # ships inside it still compiles clean from in there.

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io wants a lowercase path; the repository name already is one,
      # but deriving it rather than hardcoding keeps a rename from silently
      # publishing to a stale package.
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A published image that cannot compile the one course known to be
      # clean is a broken release, and better caught here than on the host.
      - name: the shipped example course compiles from inside the image
        run: |
          docker run --rm \
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }} \
            python -m curricle compile examples/tinylang --out /tmp/m.yaml

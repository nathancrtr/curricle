manifest_version: 1
course:
  id: rhyme-schemer
  title: NLP & computational phonology, by finishing rhyme-schemer
  mode: project
  version:
    rev: '1.2'
    date: August 2026
    note: 'corrected the Katz/Kawahara-as-vowel-data claim in Units 2 and 14 (verified against the papers:
      both are consonant data; the vowel audit ran against Hirjee & Brown''s matrices instead — see `learning/audits/`
      and tuning-ledger items 11–12); Unit 13''s dialect rules now carry their sociolinguistic citations
      in `g2p.py`.'
  pacing:
    hours_per_week:
    - 3
    - 5
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
    review: REVIEW.md
  capstone: u15
  version_history:
  - rev: '1.1'
    date: July 2026
    note: Units 2, 8, 10, 13, 14 and the frontiers revised to fold in the external research review (`REVIEW.md`)
      — corpora-first evaluation, the post-2010 detection literature, ALINE, and the workshop-paper path.
      Project-driven; revise as the repo and your understanding evolve.
  preamble:
  - Learn NLP and computational phonology **by building rhyme-schemer** — from the phonetic foundation
    already in the repo, through the rhyme-scoring kernel, to a working visualizer of rhyme schemes in
    hip-hop lyrics. For a senior software engineer at ~3–5 hrs/week; roughly 6 months.
  - '## How this curriculum works'
  - '**The repo is the spine.** This is a project-driven course: each unit takes rhyme-schemer from one
    working state to the next. The theory is just-in-time — you read the chapter or paper that unblocks
    *this* step, not a survey. Where the code already exists (the whole phonetic foundation), you read
    it as a worked example and prove your understanding by extending it; where it doesn''t (everything
    from `rhyme_score` onward), you build it, usually by making a failing test pass.'
  - '**Two tracks, interleaved.** Every unit pairs an **implementation** step with the **concept** it
    embodies. You''ll never wire up a function without understanding the phonology or algorithm behind
    it, and never meet a concept without immediately coding it.'
  - '**Each unit has:** Build (the implementation step) · Read (precise sources) · Concepts · Exercise
    · Milestone, and sometimes a Key Insight or an interactive piece in `interactive/`.'
  - '**Pacing.** One unit ≈ one week at 3–5 hrs. Phase 1 moves fast because you''re reading existing code;
    the build phases are slower. Some units run long — Unit 8 (alignment) especially. That''s expected.'
  - '**The repo''s own tests are your grader.** rhyme-schemer''s `tests/` already model the house style:
    structural property tests (identity, symmetry, range) and ordering assertions you trust over exact
    numbers. New exercises follow that style, and many ship as failing tests in `interactive/exercises/`.'
  - '**Working with Claude.** This course is built to be worked through with Claude. Triggers like *"teach
    me Unit 5 interactively"* run a Socratic lesson guide; *"quiz me on Phase 1"* draws from the question
    bank. See the end of this file.'
  resources_intro: 'A reference shelf, not a syllabus — `curriculum.md` says *when* to read what. **Tier
    1** is the core path: read substantially, these four carry the course. **Tier 2** deepens and offers
    alternatives, consulted as a unit demands. **Tier 3** is reference & practice — look things up, read
    source. **Tier 4** is culture & motivation. Every link was checked live in June 2026; entries marked
    *(added July 2026)* come from the external research review in `REVIEW.md`, itself worth reading as
    a map of where this project sits in the field.'
  reading_order:
  - 'Get the repo running: pip install -r requirements.txt; python -m unittest discover tests — all green'
  - Skim the Hirjee & Brown 2009 intro and one Pudding piece — know what you're building toward
  - Play with pronouncing in a REPL and the interactive IPA chart — get the data and the sounds under
    your fingers
  - Read phonetics.py and features.py alongside the SLP3 Phonetics chapter
  - Then open curriculum.md and start Phase 1
resources:
- key: jm
  title: Speech and Language Processing (3rd ed.)
  url: https://web.stanford.edu/~jurafsky/slp3
  formats:
  - TEXT
  tier: 1
  cite: Jurafsky & Martin · free draft · Jan 2025 release
  cost: free
  free: true
  links:
  - - Free draft (Stanford)
    - https://web.stanford.edu/~jurafsky/slp3
  why_this_one: '*The* computational-linguistics textbook, written by a computational linguist, and the
    single best map of the whole field. You already know it from your ML/AI shelf — here you''ll mine
    specific chapters rather than read cover-to-cover. It supplies the formal backbone for three pillars
    of rhyme-schemer: the **Phonetics** chapter (articulatory phonetics, the IPA, ARPAbet — exactly what
    `phonetics.py` and `features.py` encode), the **Minimum Edit Distance** section of Ch. 2 (the alignment
    algorithm you''ll need to compare vowel skeletons of unequal length), and **Vector Semantics & Embeddings**
    (Ch. 6), which reframes your feature-distance metric as a baby embedding — the conceptual bridge to
    your ML interests.'
  verified_at: 2026-06
  access_note: Chapter numbers drift between drafts; navigate by title from the index page.
- key: hb
  title: Automatic Detection of Internal and Imperfect Rhymes in Rap Lyrics
  url: https://ismir2009.ismir.net/proceedings/OS8-1.pdf
  formats:
  - PAPER
  tier: 1
  cite: Hirjee & Brown · ISMIR · 2009
  cost: free
  free: true
  links:
  - - ISMIR 2009 (PDF)
    - https://ismir2009.ismir.net/proceedings/OS8-1.pdf
  - - Hirjee's thesis, Rhyme, Rhythm, and Rhubarb (UWSpace — search the title)
    - https://uwspace.uwaterloo.ca/items
  why_this_one: This is rhyme-schemer's prior art — the paper that did this exact task and did it well.
    They score *imperfect* (slant) rhymes with a phoneme-similarity matrix learned from real rap lyrics,
    then detect internal and line-final rhymes. Reading it tells you which design decisions in the repo
    are standard practice (phoneme features, scoring over the rhyming tail) and which are your own simplifications
    (hand-placed coordinates instead of a learned matrix). It is the benchmark your finished tool should
    be measured against.
  covers: 'Deeper companions: *Using Automated Rhyme Detection to Characterize Rhyming Style in Rap Music*
    (Empirical Musicology Review 5(4):121–145, 2010) and Hirjee''s full thesis *Rhyme, Rhythm, and Rhubarb*
    expand the method and the evaluation. The thesis''s annotated lyrics were the field''s benchmark —
    an evaluation resource for Unit 14, and using them makes results directly comparable to the named
    prior art.'
  verified_at: 2026-06
  access_note: 'Field note *(added July 2026)*: their work was never displaced for this task, but it also
    wasn''t extended — today it is cited mostly as the source of the **rhyme density** metric used to
    evaluate rap *generation* (e.g. DopeLearning, Malmi et al. KDD 2016: https://arxiv.org/abs/1505.04771).
    rhyme-schemer is one of very few active successors to their actual detection program.'
- key: parrish
  title: Allison Parrish — pronouncing + phonetic-similarity work
  url: https://pronouncing.readthedocs.io/
  formats:
  - CODE
  - PAPER
  tier: 1
  cite: Allison Parrish · library, teaching notes & AAAI 2017 paper
  cost: free
  free: true
  links:
  - - pronouncing docs
    - https://pronouncing.readthedocs.io/
  - - CMUdict teaching notes
    - https://github.com/aparrish/gen-text-workshop/blob/master/cmu_pronouncing_dictionary_notes.md
  - - Poetic Sound Similarity Vectors Using Phonetic Features (AAAI 2017, PDF)
    - https://chuck.stanford.edu/chai/data/aparrish/parrish-2017-aaai.pdf
  why_this_one: Parrish is the ideal bridge figure for your profile — a programmer-poet who turns phonemes
    into feature vectors for creative tools, exactly the spirit of this project. Her library is your data
    layer; her teaching notes are the gentlest possible on-ramp to the rhyming-tail concept — her `rhyming_part()`
    ("everything from the stressed syllable nearest the end") is *precisely* the vowel-skeleton idea in
    rhyme-schemer's roadmap, in a few lines of Python; her paper shows where the feature-distance approach
    goes next (full phonetic word embeddings that handle out-of-vocabulary words). Read the docs and notes
    early, the paper around Phase 2–3.
  verified_at: 2026-06
- key: ipa
  title: A first look at articulatory phonetics — the IPA, hands-on
  url: https://www.ipachart.com/
  formats:
  - TOOL
  tier: 1
  cite: ipachart.com + the Wikipedia reference charts
  cost: free
  free: true
  links:
  - - Interactive IPA chart with audio
    - https://www.ipachart.com/
  - - IPA vowel chart (Wikipedia)
    - https://en.wikipedia.org/wiki/Vowel#Vowel_chart
  - - IPA vowel chart with audio (Wikipedia)
    - https://en.wikipedia.org/wiki/IPA_vowel_chart_with_audio
  why_this_one: '`features.py` places every vowel on the IPA vowel quadrilateral (height × backness) and
    every consonant by place × manner. To trust — and tune — those coordinates, you need the articulatory
    picture in your ear and your mouth, not just on a grid. Spend an hour *making the sounds* while watching
    where your tongue goes. This is the one place where audio beats text. (The course also ships an interactive
    vowel-quadrilateral widget built from the repo''s own numbers — see `interactive/widgets/`.)'
  verified_at: 2026-06
- key: panphon
  title: panphon — IPA → articulatory feature vectors
  url: https://github.com/dmort27/panphon
  formats:
  - CODE
  - PAPER
  tier: 2
  cite: Mortensen et al. · COLING · 2016
  cost: free
  free: true
  links:
  - - GitHub
    - https://github.com/dmort27/panphon
  - - Paper (COLING 2016)
    - https://aclanthology.org/C16-1328/
  - - API reference
    - https://github.com/dmort27/panphon#api
  why_this_one: The library `features.py` explicitly names as its future replacement. It maps 5,000+ IPA
    segments to 21 articulatory features and — crucially — its `Distance` class computes *feature-weighted
    edit distance*, which is your alignment unit (Unit 8) and your feature unit (Units 2–3) fused into
    one tool. Read its `Distance` source when you build alignment; consider swapping it in during the
    capstone.
  covers: 'API: `Distance`, the feature tables, feature-edit-distance.'
  verified_at: 2026-06
- key: epitran
  title: Epitran — precision grapheme-to-phoneme
  url: https://github.com/dmort27/epitran
  formats:
  - TOOL
  tier: 2
  cite: Mortensen et al. · 2018
  cost: free
  free: true
  links:
  - - GitHub
    - https://github.com/dmort27/epitran
  why_this_one: For Unit 13 (out-of-vocabulary words). When CMUdict doesn't have a word, you need grapheme-to-phoneme
    (G2P). Epitran is a solid rule-based G2P.
  verified_at: 2026-06
  access_note: 'Currency note *(added July 2026)*: `g2p_en` (https://github.com/Kyubyong/g2p), previously
    listed as "the neural alternative," is a 2019 artifact and effectively unmaintained. The current neural
    G2P baseline is byte-level transformers — ByT5 G2P (https://www.isca-archive.org/interspeech_2022/zhu22_interspeech.pdf)
    and CharsiuG2P (https://github.com/lingjzhu/CharsiuG2P) — with the SIGMORPHON 2020–22 shared tasks
    (https://aclanthology.org/2020.sigmorphon-1.13.pdf) as the benchmark line. For the *dialect-variant*
    gap CMUdict leaves (tuning-ledger item 2), the field''s answer is Wiktionary-scraped lexicons: WikiPron
    (Tier 3).'
- key: katz
  title: The phonology of imperfect rhyme — perceptual similarity
  url: https://www.sciencedirect.com/science/article/abs/pii/S0024384115000492
  formats:
  - PAPER
  tier: 2
  cite: Katz · Lingua 160 · 2015 — and Kawahara · J. East Asian Linguistics 16 · 2007
  links:
  - - Katz 2015, Hip-hop rhymes reiterate phonological typology (Lingua)
    - https://www.sciencedirect.com/science/article/abs/pii/S0024384115000492
  - - Katz — open repository copy (cite the Lingua venue)
    - https://researchrepository.wvu.edu/cgi/viewcontent.cgi?article=2149&context=faculty_publications
  - - Kawahara 2007, Half rhymes in Japanese rap lyrics (JEAL)
    - https://link.springer.com/article/10.1007/s10831-007-9009-1
  why_this_one: 'The deep "why" behind the whole feature-distance bet. These studies find that the imperfect
    rhymes rappers actually use track **perceptual similarity** between sounds — the empirical justification
    for modeling rhyme as distance in an articulatory space rather than as exact match. Read when you
    start tuning weights (Unit 7) and want to know what "correct" even means. (Background: Steriade''s
    P-map.)'
  covers: 'Use them as data, not just motivation — but as *consonant* data *(note added July 2026; corrected
    August 2026)*: verified against the papers, Katz''s method keys rhyme detection on matched vowel quality
    ("with no reference to consonantal properties"), so his correspondence counts measure **consonant**
    mismatches (place/voicing/continuancy, by context) with vowels held fixed by construction; Kawahara''s
    half-rhyme statistics are likewise consonant pairs (in a five-vowel language). What they *can* audit
    empirically is the **consonant** plane — e.g. Katz finds place mismatches among nasals dramatically
    cheaper than among oral stops, an asymmetry a flat place axis can''t express. For corpus-derived *vowel*
    evidence, the sources are Hirjee & Brown''s learned similarity matrix (rap-rhyme-derived) and Bark-scaled
    formant data (perceptual, not rhyme-specific). What does hold: articulatory adjacency is not perceptual
    confusability — the IPA chart is a tongue-position diagram, and the standard perceptual embedding
    is Bark-scaled formant (F1/F2) space. The line of work is alive: McPherson & Ryan (2019) survey musical
    adaptation as phonological evidence (https://compass.onlinelibrary.wiley.com/doi/10.1111/lnc3.12359),
    and a 2024 study extends imperfect-rhyme analysis to Chinese hip hop (https://www.degruyterbrill.com/document/doi/10.1515/lingvan-2024-0093/html).'
  verified_at: 2026-08
  access_note: Katz's Lingua page is abstract-only; the open repository copy has the text — cite the *Lingua*
    venue.
- key: rk
  title: Unsupervised Discovery of Rhyme Schemes
  url: https://aclanthology.org/P11-2014/
  formats:
  - PAPER
  tier: 2
  group: The detection literature after 2010
  cite: Reddy & Knight · ACL · 2011
  cost: free
  free: true
  links:
  - - ACL Anthology
    - https://aclanthology.org/P11-2014/
  why_this_one: The standard-cited paper for the task this repo calls "grouping." The scheme is a **latent
    variable** learned by EM from the corpus itself, with *no pronunciation dictionary at all*; its framing
    (a stanza's scheme as a structured object to infer, not a graph to component-ize) is the principled
    alternative to connected components. Read alongside Unit 10.
  covers: 'Group note: none of these three post-2010 lines invalidates the feature-based symbolic approach
    — they are mostly line-final-only, and Hirjee & Brown remain the only true task-peer for internal
    rap rhyme — but a research artifact must position itself against the field as it is. These three are
    the field.'
  verified_at: 2026-07
- key: plechac
  title: A Collocation-Driven Method of Discovering Rhymes
  url: https://www.researchgate.net/publication/328847558
  formats:
  - PAPER
  - CODE
  tier: 2
  group: The detection literature after 2010
  cite: Plecháč · 2018
  cost: free
  free: true
  links:
  - - Paper (ResearchGate)
    - https://www.researchgate.net/publication/328847558
  - - rhymetagger (GitHub)
    - https://github.com/versotym/rhymetagger
  - - 2026 training-size study (arXiv)
    - https://arxiv.org/abs/2604.08156
  why_this_one: Bootstraps rhyme pairs from end-of-line co-occurrence statistics, then trains on its own
    output; F ≈ 0.90–0.95 across seven languages, and still an active line (see the 2026 training-size
    study).
  verified_at: 2026-07
- key: haider
  title: Supervised Rhyme Detection with Siamese Recurrent Networks
  url: https://aclanthology.org/W18-4509/
  formats:
  - PAPER
  tier: 2
  group: The detection literature after 2010
  cite: Haider & Kuhn · 2018
  cost: free
  free: true
  links:
  - - ACL Anthology
    - https://aclanthology.org/W18-4509/
  why_this_one: '~97% pair-classification accuracy from raw *character* sequences, no phonetic features
    at all, evaluated partly on **hip-hop lyrics annotated for rhyme and assonance**. Doubly relevant:
    the neural baseline a symbolic pipeline should beat or match, and an existing annotation effort for
    Unit 14.'
  covers: Their rhyme gold standard includes a hip-hop set annotated for rhyme *and* assonance — directly
    matching the project's north star; one of Unit 14's three external corpora.
  verified_at: 2026-07
- key: aline
  title: Kondrak's ALINE — the phonetic-alignment prior art
  url: https://webdocs.cs.ualberta.ca/~kondrak/papers/chum.pdf
  formats:
  - PAPER
  tier: 2
  cite: Kondrak · NAACL · 2000
  cost: free
  free: true
  links:
  - - A New Algorithm for the Alignment of Phonetic Sequences (PDF)
    - https://webdocs.cs.ualberta.ca/~kondrak/papers/chum.pdf
  why_this_one: 'Unit 8''s Needleman–Wunsch over vowel skeletons with feature-decomposed substitution
    costs is, almost exactly, ALINE — the standard phonetic-alignment algorithm for 25 years. Reinventing
    it was the right pedagogical call; read it afterward for credit and for the design answers it already
    worked out: per-feature **salience weights**, separate vowel/consonant treatment, and expansions/compressions
    for diphthongs — several questions the repo currently answers ad hoc.'
  verified_at: 2026-07
- key: mcflow
  title: 'MCFlow: A Digital Corpus of Rap Transcriptions'
  url: https://emusicology.org/article/id/4737/
  formats:
  - PAPER
  - DATA
  tier: 2
  group: Evaluation corpora & the beat grid
  cite: Condit-Schultz · Empirical Musicology Review 11(2) · 2016
  cost: free
  free: true
  links:
  - - Paper + corpus (Empirical Musicology Review)
    - https://emusicology.org/article/id/4737/
  why_this_one: 124 rap songs, 374 verses, ~6k measures, freely available, with rhythmic, prosodic, phonetic
    **and rhyme** annotations *including metric placement*. One dataset addresses both the Unit 14 evaluation
    gap and the prosody frontier (ledger items 5–6); its observed stress placements could even validate
    the scanner's inferred anchors directly.
  covers: Unit 14 ground truth + beat-grid data.
  verified_at: 2026-07
  access_note: 'Content-safety caveat: the repo''s fixture rule (no multi-line commercial lyrics) is in
    tension with evaluating on corpora of commercial rap. Evaluate locally against downloaded corpora;
    the harness should store **song IDs + offsets, never lyric text**.'

  why_this_one: The breakdown of multisyllabic and internal rhyme in rap is the clearest motivation for
    why perfect-rhyme matching is not enough — and previews internal rhyme (Unit 11).
  verified_at: 2026-06
  access_note: The shelf links this by title — the link is that YouTube search (Vox, Earworm series).

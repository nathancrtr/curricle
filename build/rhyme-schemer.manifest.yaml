manifest_version: 1
course:
  id: rhyme-schemer
  title: NLP & computational phonology, by finishing rhyme-schemer
  mode: project
  version:
    rev: '1.2'
    date: August 2026
    note: 'corrected the Katz/Kawahara-as-vowel-data claim in Units 2 and 14 (verified against the papers:
      both are consonant data; the vowel audit ran against Hirjee & Brown''s matrices instead — see `learning/audits/`
      and tuning-ledger items 11–12); Unit 13''s dialect rules now carry their sociolinguistic citations
      in `g2p.py`.'
  pacing:
    hours_per_week:
    - 3
    - 5
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
    review: REVIEW.md
  capstone: u15
  version_history:
  - rev: '1.1'
    date: July 2026
    note: Units 2, 8, 10, 13, 14 and the frontiers revised to fold in the external research review (`REVIEW.md`)
      — corpora-first evaluation, the post-2010 detection literature, ALINE, and the workshop-paper path.
      Project-driven; revise as the repo and your understanding evolve.
phases:
- id: p0
  num: 0
  title: Orientation
  goal: Know what you're building and why, and get the foundation running.
  entries:
  - u0
  weeks:
  - 0
  - 0
- id: p1
  num: 1
  title: The phonetic foundation already in the repo
  goal: Master the concepts the existing modules encode, by reading and extending them. By the end you
    understand every line of `phonetics.py`, `models.py`, `syllabify.py`, and `features.py`, and you've
    made each one yours by extending it.
  entries:
  - u1
  - u2
  - u3
  - u4
  weeks:
  - 1
  - 5
  checkpoint:
    prose: 'You can read every module in the repo, explain the phonology each encodes, and you''ve extended
      all four with tests of your own. You understand that the whole foundation exists to produce one
      thing: a `Pronunciation` whose `vowel_skeleton` you can now reason about. You''re ready to build
      forward.'
    quiz: q-phase-1
- id: p2
  num: 2
  title: The rhyme kernel
  goal: Build `rhyme_score(a, b) -> float`, the piece the README calls "next up." Start from the perceptual
    definition of rhyme, ship the perfect-rhyme special case first, then loosen to graded slant rhyme,
    then handle unequal lengths with sequence alignment.
  entries:
  - u5
  - u6
  - u7
  - u8
  weeks:
  - 6
  - 10
  checkpoint:
    prose: '`rhyme_score` exists and works: it detects perfect rhyme exactly, grades slant rhyme by feature
      distance, and aligns tails of unequal length. You''ve implemented a feature-weighted alignment from
      scratch and understand it as classic NLP. The engine is built; the rest is putting it to work.'
    quiz: q-phase-2
- id: p3
  num: 3
  title: From pair-scores to a rhyme scheme
  goal: Move from "do these two rhyme?" to "find and group all the rhymes in a verse."
  entries:
  - u9
  - u10
  - u11
  weeks:
  - 11
  - 15
  checkpoint:
    prose: Given a verse, rhyme-schemer finds the rhymes — line-final, internal, and multisyllabic — and
      groups them. Everything needed to *show* the scheme now exists as data.
    quiz: q-phase-3
- id: p4
  num: 4
  title: Visualization, OOV/G2P, and evaluation
  goal: Make it visible, make it robust to unknown words, and find out whether it's any good.
  entries:
  - u12
  - u13
  - u14
  weeks:
  - 16
  - 22
  checkpoint:
    prose: 'rhyme-schemer is end-to-end: text in, highlighted rhyme scheme out, unknown words handled,
      with a number that says how well it works and a roadmap for improving it.'
    quiz: q-phase-4
- id: p5
  num: 5
  title: Capstone & frontiers
  goal: ''
  entries:
  - u15
  weeks:
  - 23
  - null
units:
- id: u0
  num: 0
  phase: p0
  title: Orientation
  rows:
  - label: Build
    content: Nothing yet. `pip install -r requirements.txt`; `python -m unittest discover tests` — all
      green.
  - label: Read
    content: 'the repo `README.md` (including "Where this sits in the field"); the introduction of Hirjee
      & Brown (2009); one Pudding piece; skim the external research review in `REVIEW.md` to see how the
      finished project reads to a researcher. Play in a REPL: `pronouncing.phones_for_word("lincoln")`,
      `pronouncing.rhymes("cheese")`.'
  - label: Concepts
    content: the syllable-first pipeline (look up → syllabify → feature-score → rhyme-kernel → group →
      visualize); slant rhyme vs perfect rhyme; why "Lincoln/reason" must count.
  - label: Milestone
    content: Tests pass locally, and you can describe the pipeline and the north star in your own words.
  gloss: Tests green locally; the pipeline and the north star in your own words.
  provenance: bespoke
  check:
    q: Why does the README insist the tool target *vowel sounds* rather than spelling? If you're not sure,
      that's exactly what Unit 1's lesson guide opens with.
    ans: ''
- id: u1
  num: 1
  phase: p1
  title: Phonemes, ARPAbet & the lexicon
  rows:
  - label: Build
    content: Read `phonetics.py` (`Stress`, `VOWELS`, `strip_stress`, `is_vowel`) and the `pronouncing`/CMUdict
      layer in `syllabify.py` (`pronunciation_for`). Add property-based tests for `strip_stress`/`is_vowel`.
  - label: Read
    content: SLP3 **Phonetics** chapter (phonemes, IPA, ARPAbet); Parrish's CMUdict notes; ARPABET (Wikipedia).
  - label: Concepts
    content: phoneme vs grapheme; transcription systems (IPA vs ARPAbet); the pronunciation lexicon; lexical
      stress (0/1/2); the out-of-vocabulary (OOV) problem; why CMUdict returns *variants*.
  - label: Exercise
    content: In a REPL, collect five words CMUdict gets interestingly wrong or lacks (slang, names — *"Coogi"*).
      Write tests asserting `strip_stress("IH1") == ("IH", PRIMARY)` and friends, and that every ARPAbet
      vowel round-trips.
  - label: Milestone
    content: New passing tests for the phonetics primitives, and a short note listing five OOV words (your
      future Unit-13 test set).
  - label: Interactive
    content: '`interactive/lessons/unit-01-phonemes-not-spelling.md`.'
  gloss: Phonemes, ARPAbet, and the CMU lexicon — sound, not spelling.
  provenance: bespoke
- id: u2
  num: 2
  phase: p1
  title: The IPA vowel space & articulatory features (vowels)
  rows:
  - label: Build
    content: Read the vowel half of `features.py` (`VowelPoint`, `VowelFeatures`, `VOWEL_FEATURES`, `vowel_distance`).
      Adjust or justify two coordinate choices without breaking the ordering tests.
  - label: Read
    content: SLP3 Phonetics (vowels); the interactive IPA chart (make the sounds!); the vowel-quadrilateral
      references.
  - label: Concepts
    content: the IPA vowel quadrilateral (height × backness); roundedness; the rhotic `ER`; tense/lax
      falling out of position (centralization); **diphthongs as a glide** between two points; distance
      on a plane as similarity.
  - label: Exercise
    content: Open `interactive/widgets/vowel-explorer.html`, click pairs, and confirm by hand that the
      widget's numbers match `vowel_distance`. Then change one vowel's coordinates in `features.py`, predict
      which ordering tests shift, and check.
  - label: Milestone
    content: You can explain why `IH` sits lower and more central than `IY`, and why a single point can't
      model `AY`.
  - label: Key insight
    content: This table is a tiny, hand-built **embedding**. "Similarity = distance in a feature space"
      is the same move word2vec makes — you're meeting it in 15 vowels instead of 50,000 words.
    kind: key
  - label: Caveat to carry forward
    content: articulatory adjacency is not perceptual confusability — the quadrilateral is a tongue-position
      diagram, not a psychoacoustic space (that would be Bark-scaled formant space). Corpus evidence on
      which vowel pairs rappers *actually* treat as rhymable exists — Hirjee & Brown 2009's learned log-odds
      matrices, transcribed and rank-compared against this very space in `learning/audits/` (the audit
      found two systematic biases; tuning-ledger item 11 tells the story, and it's a preview of what Unit
      14 does at scale). (Katz 2015 and Kawahara 2007, once cited here for this purpose, turn out on verification
      to be *consonant* data — the corrected note in `learning-resources.md` explains.) Unit 14 makes
      "refit this space from data" a first-class experiment.
  - label: Interactive
    content: widget `vowel-explorer.html`; lesson `unit-02-feature-distance.md`.
  gloss: The IPA vowel space as coordinates; feature distance as graded similarity.
  provenance: bespoke
- id: u3
  num: 3
  phase: p1
  title: 'Consonants: place, manner, voicing, sonority'
  rows:
  - label: Build
    content: Read the consonant half of `features.py` (`CONSONANT_FEATURES`, `consonant_distance`). Add
      a near-pair ordering assertion of your own.
  - label: Read
    content: SLP3 Phonetics (consonants); Sonority Sequencing Principle (Wikipedia).
  - label: Concepts
    content: place × manner as the consonant plane; the **sonority hierarchy** (stop → … → glide) and
      why manner is ordered by it; voicing as a small perceptual cue (hence the low `_W_VOICE`); why consonants
      matter to rhyme mostly in the coda.
  - label: Exercise
    content: Add an assertion that voicing pairs (e.g. `S`/`Z`, `P`/`B`) are closer than same-manner different-place
      pairs, and explain the weight that makes it true.
  - label: Milestone
    content: A passing consonant test you wrote, plus a one-paragraph rationale for the sonority ordering.
  gloss: 'Consonants: place, manner, voicing, sonority — the parallel plane.'
  provenance: bespoke
- id: u4
  num: 4
  phase: p1
  title: 'Syllables & phonotactics: the Maximal Onset Principle'
  rows:
  - label: Build
    content: Read `models.py` (`Syllable`, `Pronunciation`, `rime`, `vowel_skeleton`), the onset tables
      in `phonetics.py` (`is_legal_onset`), and `syllabify.py` (`_split_consonants`, `syllabify`). Add
      an onset cluster a new word needs.
  - label: Read
    content: SLP3 Phonetics (syllable structure); Phonotactics & Syllable (Wikipedia).
  - label: Concepts
    content: onset / nucleus / coda / **rime**; phonotactics; the Sonority Sequencing Principle as the
      rule behind legal onsets (and the /s/-cluster exceptions); the **Maximal Onset Principle**; one
      nucleus per syllable; word-edge handling.
  - label: Exercise
    content: Open `interactive/widgets/syllabifier.html`, run the test words, and trace the MOP split
      by hand for one. Then pick a word whose syllabification is currently wrong or unsupported, add the
      needed onset cluster to `phonetics.py`, and add a `test_syllabify` case for it.
  - label: Milestone
    content: A new word correctly syllabified, gated by a test you wrote.
  - label: Interactive
    content: widget `syllabifier.html`; quiz `interactive/quizzes/phase-1-checkpoint.html`.
  gloss: Syllables and the Maximal Onset Principle.
  provenance: bespoke
- id: u5
  num: 5
  phase: p2
  title: The vowel skeleton & the rhyme-bearing tail
  rows:
  - label: Build
    content: A new `rhyme_schemer/rhyme.py`. Implement `rhyme_tail(pron) -> tuple[Syllable, ...]` — the
      syllables from the **last primary-stressed** syllable to the end (the perceptual rhyming part).
  - label: Read
    content: Parrish's `rhyming_part()` notes; Hirjee & Brown §2 (what counts as a rhyme).
  - label: Concepts
    content: why rhyme lives in the tail from the last stress (not the last syllable — "lessen"/"strengthen"
      share a final syllable but don't rhyme); the rime; stress as the anchor; reusing `Pronunciation.vowel_skeleton`.
  - label: Exercise
    content: '`interactive/exercises/unit-05-rhyme-tail/` ships failing tests; make them pass. Edge cases:
      no primary stress (fall back to last secondary, then last vowel); monosyllables.'
  - label: Milestone
    content: '`rhyme_tail` passes its suite, including the "lessen/strengthen don''t rhyme" case.'
  gloss: The vowel skeleton and the rhyme-bearing tail from the last stress.
  provenance: bespoke
- id: u6
  num: 6
  phase: p2
  title: Perfect rhyme first
  rows:
  - label: Build
    content: '`rhyme_score(a, b)` for the **equal-length** case: average `vowel_similarity` over aligned
      nuclei in the tail, with `consonant_similarity` on codas weighted lower and onsets ignored. Calibrate
      so identical tails score `1.0`.'
  - label: Read
    content: re-skim Hirjee & Brown's scoring section.
  - label: Concepts
    content: model the easy case before the hard one; the threshold-`1.0` special case; weighting nuclei
      over codas; ignoring onsets (the README's design).
  - label: Exercise
    content: Failing tests for perfect rhymes (`cat`/`hat`, `time`/`rhyme`) and clear non-rhymes; make
      them pass. Assert the score is symmetric and in `[0, 1]` (the repo's house style).
  - label: Milestone
    content: Perfect rhyme detected at threshold `1.0`; non-rhymes well below.
  gloss: Perfect rhyme as the threshold-1.0 special case.
  provenance: bespoke
- id: u7
  num: 7
  phase: p2
  title: Graded slant rhyme & weighting
  rows:
  - label: Build
    content: 'Turn `rhyme_score` into the graded kernel: expose weights (coda weight, nucleus weight)
      and a threshold; tune so slant rhymes land between perfect and non-rhyme.'
  - label: Read
    content: the perceptual-similarity phonology paper (why imperfect rhyme tracks perceptual closeness);
      Hirjee & Brown's imperfect-rhyme results.
  - label: Concepts
    content: rhyme as graded, not binary; the threshold as a tunable knob; **perceptual similarity** as
      the target your weights approximate; the danger of over-fitting weights to a few examples.
  - label: Exercise
    content: Make "Lincoln"/"reason" score as a slant rhyme above your chosen threshold while "Lincoln"/"orange"
      stays below. Encode the *ordering* (perfect > slant > none) as tests, not exact magnitudes.
  - label: Milestone
    content: A graded `rhyme_score` that ranks a small battery of pairs the way your ear does.
  - label: Interactive
    content: widget `interactive/widgets/rhyme-score-sandbox.html` — two words in, every receipt out (tails,
      alignment, per-column blend), exactly `rhyme_score()`'s numbers; lesson `unit-07-the-rhyme-kernel.md`.
  gloss: 'Graded slant rhyme: the kernel''s nucleus/coda weighting.'
  provenance: bespoke
- id: u8
  num: 8
  phase: p2
  title: 'Unequal lengths: sequence alignment'
  rows:
  - label: Build
    content: 'Generalize `rhyme_score` to tails of **different lengths** (multisyllabic rhyme) via alignment:
      implement Needleman–Wunsch over vowel skeletons using `vowel_distance` as substitution cost and
      a tuned gap penalty.'
  - label: Read
    content: SLP3 Ch. 2 **Minimum Edit Distance** (the algorithm, the backtrace); panphon's `Distance`
      source (feature-weighted edit distance in the wild); afterward, Kondrak (2000) — what you just built
      is, almost exactly, **ALINE**, the standard phonetic-alignment algorithm for 25 years, and its salience
      weights, vowel/consonant split, and diphthong expansions answer questions we handle ad hoc.
  - label: Concepts
    content: edit distance / Needleman–Wunsch / DTW; substitution cost from a feature metric; gap penalties;
      alignment as the general case of which equal-length scoring was a special case.
  - label: Exercise
    content: '`interactive/exercises/unit-08-alignment/` — implement the DP table and backtrace; make
      multisyllabic tests pass (e.g. "national"/"rational"; a 3-syllable vs 2-syllable near-rhyme). Verify
      equal-length inputs still match Unit 6''s scores.'
  - label: Milestone
    content: Multisyllabic slant rhymes scored sensibly; the alignment visualized in the lesson.
  - label: Key insight
    content: This is the same dynamic-programming alignment used for spell-check and DNA — you're applying
      a workhorse NLP algorithm to vowels.
    kind: key
  - label: Interactive
    content: lesson `unit-08-alignment.md`.
  gloss: 'Needleman-Wunsch over vowel skeletons: unequal-length tails.'
  provenance: bespoke
- id: u9
  num: 9
  phase: p3
  title: Multi-word spans & pronunciation variants
  rows:
  - label: Build
    content: '`pronunciation_for_span(words)` (a span is just a `Pronunciation`); make scoring **variant-aware**
      (best score over CMUdict variants), replacing the current first-variant-only behavior.'
  - label: Read
    content: '`pronouncing` API (`phones_for_word` returns a list); the README note on multi-word spans.'
  - label: Concepts
    content: a multi-word span and a single word are the same downstream object; pronunciation **variants**
      and why rappers exploit them (coercion); taking the max over variants.
  - label: Exercise
    content: Score a multisyllabic *multi-word* rhyme (e.g. "get up"/"setup"). Add a variant case where
      the rhyme only works under the second pronunciation.
  - label: Milestone
    content: Spans and variants flow through `rhyme_score` unchanged downstream.
  gloss: Multi-word spans and pronunciation variants.
  provenance: bespoke
- id: u10
  num: 10
  phase: p3
  title: 'Grouping rhymes: similarity graphs & components'
  rows:
  - label: Build
    content: '`group_rhymes(words, threshold)` — build a graph where an edge means "score ≥ threshold,"
      then return connected components as rhyme classes.'
  - label: Read
    content: SLP3 on clustering basics; any union-find reference; Reddy & Knight (2011) — the standard-cited
      paper for this task, which makes the *scheme* a latent variable to infer rather than a graph to
      component-ize.
  - label: Concepts
    content: 'pairwise scores → groups; thresholding; the **non-transitivity of slant rhyme** (A rhymes
      with B, B with C, but not A with C) and why connected components is a deliberate (debatable) choice;
      union-find. Know the debate''s names: components over threshold edges is **single-link clustering**,
      its failure mode is **chaining** (one generous edge glues two good clusters — the oldest known clustering
      pathology, and it *will* fire in Unit 11''s ledger), and the principled alternatives are correlation
      clustering on signed weights, community detection penalizing sparse cuts, or Reddy & Knight''s scheme-as-inference.'
  - label: Exercise
    content: Group the line-end words of a real verse. Find a real non-transitive triple and decide how
      your grouping should treat it; encode the decision as a test.
  - label: Milestone
    content: Line-end words of a verse grouped into colored rhyme classes (data, not yet pixels).
  - label: Interactive
    content: lesson `unit-10-non-transitivity.md`; quiz `interactive/quizzes/phase-3-checkpoint.html`
      (build here).
  - label: Key insight
    content: Slant-rhyme grouping isn't an equivalence relation — similarity rarely is. Choosing components
      vs. stricter clustering *is* a modeling decision, and naming it is half of computational linguistics.
    kind: key
  gloss: Rhyme groups as connected components; transitivity imposed on a relation that lacks it.
  provenance: bespoke
- id: u11
  num: 11
  phase: p3
  title: 'Internal & multisyllabic rhyme: scanning a verse'
  rows:
  - label: Build
    content: A scanner that slides over syllables (not just line ends) to surface internal and multisyllabic
      rhymes within and across lines.
  - label: Read
    content: Hirjee & Brown on internal-rhyme detection; the Vox "Rapping, deconstructed" breakdown.
  - label: Concepts
    content: rhyme is not only line-final; windowing over the syllable stream; ranking candidate matches
      by score and length (longest/nearest, as Hirjee & Brown do).
  - label: Exercise
    content: On a verse with known internal rhymes, surface them; tune to suppress spurious low-score
      matches.
  - label: Milestone
    content: Internal rhymes in a real verse detected and scored.
  gloss: Scanning a verse for internal and multisyllabic rhyme.
  provenance: bespoke
  note: 'This unit''s guide is the scanner walkthrough — written during the collaborative build, warts
    and wrong turns included, and it contains the project''s living open tuning ledger. The Markdown file
    in interactive/lessons/ remains the engineering-canonical copy that code comments cite.

    '
- id: u12
  num: 12
  phase: p4
  title: Visualizing the scheme
  rows:
  - label: Build
    content: A renderer that takes grouped rhymes and emits highlighted output — an HTML page coloring
      each rhyme class (Pudding/Vox style), plus a terminal fallback.
  - label: Read
    content: the Pudding pieces; Hirjee & Brown's "Rhyme Analyzer" UI (five formatting styles for overlapping
      rhymes).
  - label: Concepts
    content: mapping rhyme classes to colors; handling a word in multiple classes (internal + line-final);
      designing for the non-specialist reader.
  - label: Exercise
    content: Render a full verse to a standalone HTML file; handle the overlapping-membership case.
  - label: Milestone
    content: A shareable HTML visualization of a verse's rhyme scheme — the README's original goal, realized.
  gloss: 'Rendering the scheme: color by rhyme class.'
  provenance: bespoke
- id: u13
  num: 13
  phase: p4
  title: Out-of-vocabulary words & grapheme-to-phoneme
  rows:
  - label: Build
    content: 'A G2P fallback for words CMUdict lacks (your Unit-1 list): rule-based first; optionally
      wire in a neural G2P.'
  - label: Read
    content: Epitran; for the neural side, the current baseline is byte-level transformers (ByT5 G2P,
      CharsiuG2P) benchmarked in the SIGMORPHON 2020–22 shared tasks — `g2p_en`, once the standard mention,
      is a 2019 artifact and effectively unmaintained; SLP3 on G2P if present in your draft.
  - label: Concepts
    content: 'the OOV problem; **grapheme-to-phoneme** as rule-based vs **neural** (a direct bridge to
      your transformer knowledge); confidence/flagging of guessed pronunciations; dialect respellings
      as *performance transcriptions*, not noise. The dialect rules (g-drop, -a-for-er) encode **documented
      AAE and vernacular phonology** — velar nasal fronting and non-rhoticity — and each rule now carries
      its citation in `g2p.py` (Fischer 1958 and Green 2002 for the (ING) variable; Thomas 2007 for non-rhoticity,
      whose "most common in unstressed syllables" finding is exactly the -a rule''s environment): the
      citations harden the rules *and* answer the "why does your tool rewrite Black speech?" question
      with receipts. (The NLP-on-AAE literature is substantially about systems *failing* AAE speakers;
      a tool that takes performed AAE phonology as ground truth is on the right side of that, and should
      say so deliberately.)'
  - label: Exercise
    content: Replace skip-and-flag with a G2P guess for three of your OOV words; mark guesses as lower-confidence
      so scoring can discount them.
  - label: Milestone
    content: A previously-skipped word participates in a detected rhyme, flagged as G2P-derived.
  gloss: Out-of-vocabulary words and the G2P fallback chain.
  provenance: bespoke
- id: u14
  num: 14
  phase: p4
  title: 'Evaluation: is it any good?'
  rows:
  - label: Build
    content: 'An eval harness, then point it at ground truth that mostly **already exists** — don''t build
      gold from scratch when the field has it. Three corpora: **MCFlow** (Condit-Schultz 2016 — 124 rap
      songs transcribed with rhyme annotations *and their metric placement*), **Haider & Kuhn''s** hip-hop
      set (annotated for rhyme *and assonance* — exactly the north star), and **Hirjee & Brown''s own
      annotated lyrics** (thesis — makes results directly comparable to the named prior art). In-house
      annotation only fills gaps, and then with a **second annotator and a reported agreement figure**
      — otherwise the tuning sweep optimizes toward one person''s ear. Content safety: evaluate locally
      against downloaded corpora; store song IDs + offsets in the repo, never lyric text.'
  - label: Read
    content: SLP3 Ch. 2 on **precision / recall / F-score**; Hirjee & Brown's evaluation methodology;
      the MCFlow paper; Haider & Kuhn (2018) on their annotation.
  - label: Concepts
    content: annotate *groups*, score *pairs* (groups impose transitivity gold shouldn't); **two metric
      families answering different questions** — pairwise link P/R/F vs class-level clustering metrics
      (B-cubed, adjusted Rand) — the mega-class pathologies (ledger items 1, 9) only show up in the latter,
      so report both; inter-annotator agreement as the *ceiling* any scanner score is read against (annotator
      disagreement on slant rhyme is Katz's finding, not an annoyance); error analysis as the real payoff.
  - label: Exercise
    content: 'Run the harness on external gold plus your own double-annotated verses; do the error analysis:
      are misses threshold problems, feature-coordinate problems, or OOV problems? Route each to its ledger
      item. Then design the sweep as **conditions, not just dials**: alongside thresholds/weights/chaining-gate
      values, include (a) *refit the vowel space from rhyme-pair data* — Hirjee & Brown''s central BLOSUM-style
      move; the quick pre-check already ran as `learning/audits/` (rank comparison against their published
      matrices; ledger items 11–12 — Katz''s and Kawahara''s tables, once slated for this role, are consonantal
      and audit the consonant space instead) — and (b) *one edge-weight-aware clustering condition* (correlation
      clustering or similar) to measure what the connected-components choice actually costs.'
  - label: Milestone
    content: P/R/F *and* clustering numbers against external gold, an agreement ceiling to read them against,
      and a prioritized list of what to fix — measured, not guessed.
  - label: Key insight
    content: You can't improve what you can't measure, and rhyme has no perfect ground truth — agreement
      is partial, *and that is a fact about the task*. Building the ruler is as much the work as building
      the tool; borrowing the field's rulers is how your numbers mean something to anyone else.
    kind: key
  gloss: 'Evaluation: gold annotation, corpora-first ground truth.'
  provenance: bespoke
- id: u15
  num: 15
  phase: p5
  title: 'Capstone: the finished tool + the written understanding'
  rows:
  - label: Build
    content: 'Polish the pipeline into one entry point: paste a verse → an HTML visualization of its rhyme
      scheme, OOV handled, score reported. Then write a 2–3 page articulation of the phonology and NLP
      you now understand — phonemes and features, syllabification, the rhyme kernel, alignment, grouping,
      G2P, evaluation — and where each lives in the code.'
  - label: Milestone
    content: A demo you'd show someone, plus the writeup that proves the learning, not just the code.
  - label: Swap in panphon
    content: for the hand-built feature tables; compare detections and re-run your eval.
  - label: Phonetic word embeddings
    content: '(Parrish 2017): represent whole lines as vectors for fast candidate retrieval before exact
      scoring.'
  - label: Unsupervised rhyme-scheme discovery
    content: '(Reddy & Knight 2011; also Addanki & Wu 2013): the scheme as a latent variable inferred
      by EM, no pronunciation dictionary at all — the principled alternative to Unit 10''s components,
      and a different answer to the mega-class problem.'
  - label: Prosody & flow
    content: 'bring stress/meter into scoring, not just segments. This frontier has a literature — Adams
      (2009) on the metrical techniques of flow, MCFlow''s beat-grid encoding, Ohriner''s *Flow* (2019)
      — and one concrete experiment: validate the scanner''s *inferred* performed-stress anchors against
      MCFlow''s *observed* placements.'
  - label: Variant disambiguation
    content: pick the pronunciation that maximizes *whole-verse* rhyme, not per-pair.
  - label: The workshop paper.
    content: 'Per the external review (`REVIEW.md` §5), three of the scanner''s ideas are genuinely fresh:
      performed stress as an enumerable, *priced* reading; the average-raising extension rule (with chain
      auto-splitting as a corollary); and "dialect spellings are performance transcriptions." Alone none
      is a paper; together — the scanner with priced performed-stress inference, evaluated on MCFlow against
      Hirjee & Brown and a Haider & Kuhn-style neural baseline — they plausibly clear the bar at the NLP4MusA
      / Computational Humanities / ML4Audio workshop tier. Unit 14''s numbers are the missing ingredient.'
  gloss: 'Capstone: the finished tool plus the written understanding.'
  provenance: bespoke

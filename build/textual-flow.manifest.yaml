manifest_version: 1
course:
  id: textual-flow
  title: Textual criticism & computational philology
  mode: research
  version:
    rev: '1.0'
    date: '2026-08-27'
    note: 'Companion documents: `learning-resources.md` (every source cited here, with access notes),
      `REVIEW.md` (research positioning), `exploration/` (how this program was chosen).'
  pacing:
    hours_per_week:
    - 3
    - 5
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
    review: REVIEW.md
    exploration: exploration/
  description: 'Learn New Testament textual criticism and computational philology by building a simulation
    & sensitivity laboratory for the CBGM — with Koine Greek alongside, start to finish.

    '
  capstone: u22
  trigger_phrases:
  - say: Teach me Unit 2 interactively.
    note: Socratic lessons exist for units 1, 2, 3, 4, 6, 8, 19; any other unit gets improvised from the
      curriculum.
  - say: Quiz me on Phase 1.
    note: live quizzing from the question bank, wrong answers taught, not just marked.
  - say: Drill me on Greek.
    note: alphabet rounds now; paradigms, parsing, and translate-checks as Decker advances.
  - say: Review my Unit 7 design doc — tear it apart.
  - say: My numbers disagree with open-cbgm. Help me find who's wrong.
  - say: Draft the INTF email with me.
    note: the Phase 2 contact milestone (drafting together; sending is yours).
  storage_key: tf-progress
  preamble:
  - 'Learn New Testament textual criticism and computational philology **by building textual-flow** —
    a simulation and sensitivity laboratory for the Coherence-Based Genealogical Method (CBGM) — through
    to three research deliverables: a simulation study with known ground truth, a sensitivity analysis
    of a published critical text, and an LLM local-stemma experiment. For a senior software engineer at
    ~3–5 hrs/week; roughly 18–24 months, in phases that each stand alone.'
  - '## How this curriculum works'
  - '**The research program is the spine.** This is a research-driven course: the artifact you''re building
    is a *research question and its answer*, not just an app. The question (versioned in the repo''s `REVIEW.md`
    and `exploration/convergence.md`): *how robust is the CBGM — and the New Testament text it now decides
    — to the human judgments and structural assumptions inside it?* Every unit either builds a piece of
    the apparatus that answers it or builds the background you need to answer it credibly. Where prior
    work exists (open-cbgm, the artificial-tradition literature), you read it as worked examples; where
    it doesn''t (everything this program contributes), you build it.'
  - '**Two tracks, interleaved.** The **program track** (~2–3 hrs/wk) builds the laboratory. The **Greek
    track** (~1.5–2 hrs/wk, steady) runs continuously from week 0 — languages reward little-and-often
    far more than bingeing, so treat it as a near-daily 15–25 minute habit rather than a weekly block.
    Each phase states its Greek goal; the program track is scheduled assuming Greek is happening alongside.
    The two converge deliberately: the Johannine epistles are simultaneously the simplest Greek in the
    NT *and* the ECM data your laboratory runs on. By Phase 5 you will be reading, in Greek, the very
    variation units your perturbation harness is flipping.'
  - '**Each unit has:** Build (the implementation step) · Read (precise sources — see `learning-resources.md`
    for every citation) · Concepts · Exercise · Milestone, and sometimes a Key Insight or an interactive
    piece in `interactive/`.'
  - '**Pacing.** One unit ≈ one week at the stated hours, but the variance is real: Unit 3 (genealogical
    coherence) and Unit 12 (the experiment grid) run long; Units 5 and 14 run short. Phases end with checkpoints;
    if a checkpoint feels shaky, camp there — the dependency map at the end shows what is load-bearing.'
  - '**Tests are your grader.** From Unit 2 onward you maintain a test suite. The house style (inherited
    from rhyme-schemer): structural property tests and ordering assertions you trust over exact numbers
    — plus, unique to this project, **cross-validation against open-cbgm**: wherever you reimplement a
    CBGM computation, a test asserts your numbers match Joey McCollum''s implementation on the same input.
    When they disagree, one of you is wrong, and finding out which is always worth the hour.'
  - '**Reception discipline is part of the method.** This field has scar tissue (Morton, Radday — see
    `exploration/field-map.md` §4). Every written deliverable follows the rules learned there: calibrated
    instrument with stated uncertainty, validated on ground truth the guild accepts, never "the computer
    settles X." The write-up units bake this in.'
  - '**Working with Claude.** *"Teach me Unit 3 interactively"* runs a Socratic lesson guide; *"quiz me
    on Phase 1"* draws from the question bank. See the end of this file.'
  resources_intro: '**Tier 1** is the core path — worked through substantially, in curriculum order. **Tier
    2** deepens and fills gaps on demand. **Tier 3** is data, tools, and reference — looked up in, not
    read. **Tier 4** is video & audio. Each entry says *why this one* and what access costs; mark a resource
    "in hand" once your copy or access is sorted, and keep loan dates or purchase notes on the entry itself.
    The unavoidable paid core is **≈ $120** (Wasserman & Gurry + the Mink volume + Decker) — everything
    else has a free path or a library workaround.'
  reading_order:
  - Wasserman & Gurry (fast skim, then chapter-by-chapter through Phase 1)
  - Parker, selectively (alongside Unit 1)
  - Mink, pass 1 (Unit 3) — with the Genealogical Queries guide + live tool
  - Gurry's *Critical Examination* + Mink pass 2 + the Carlson/Mink exchange (Phase 2)
  - Handbook of Stemmatology ch. 5 + the Camps papers (Phases 2–3)
  - Taming the BEAST + McCollum & Turnbull (+ McElreath as needed) (Phase 4)
  - Royse + Metzger's *Commentary* + Willker (Phase 6)
  - 'Greek: Decker continuously from week 0; STEP Bible from Phase 3; Wallace from Phase 5'
tracks:
- id: greek
  name: Koine Greek
  stages:
  - id: g-alpha
    label: alphabet
  - id: g-nouns
    label: nouns & articles
  - id: g-verbs
    label: verbs arrive
  - id: g-1john
    label: reading 1 John
  - id: g-app
    label: apparatus literate
  - id: g-mark
    label: Mark with helps
  cadence: 1.5-2 hrs/wk, near-daily
  row_labels:
  - Greek track
  checkpoint_labels:
  - Greek by now
resources:
- key: wg
  title: 'A New Approach to Textual Criticism: An Introduction to the CBGM'
  url: https://cart.sbl-site.org/books/060399P
  formats:
  - TEXT
  tier: 1
  group: Textual criticism & the CBGM
  cite: Wasserman & Gurry · SBL Press · 2017
  cost: paid ~$20
  free: false
  links:
  - - SBL Press
    - https://cart.sbl-site.org/books/060399P
  why_this_one: The standard gentle on-ramp to the CBGM, written by a sympathetic critic (Gurry) and a
    practitioner (Wasserman) — ~100 pages, readable in two sittings, and the only book-length introduction
    that exists. The whole of Phases 0–1 hangs off it.
  access_note: '**Buy it** — cheap enough to purchase without thinking; used copies are common.'
- key: mink
  title: “Contamination, Coherence, and Coincidence in Textual Transmission”
  url: https://cart.sbl-site.org/books/067008P
  formats:
  - TEXT
  tier: 1
  group: Textual criticism & the CBGM
  cite: Gerd Mink · in Wachtel & Holmes (eds.), The Textual History of the Greek New Testament, pp. 141–216
    · SBL Text-Critical Studies 8 · 2011
  cost: paid $37 pbk
  free: false
  links:
  - - SBL Press
    - https://cart.sbl-site.org/books/067008P
  why_this_one: The primary source — the method from its inventor, in its fullest methodological statement.
    Dense; the curriculum schedules three passes (definitions → worked examples → adversarial).
  access_note: '**Not open access** — only the front matter is free. The $37 paperback buys the rest of
    the volume''s status-quaestionis essays too.'
- key: gurry
  title: A Critical Examination of the CBGM
  url: https://brill.com/display/title/35755
  formats:
  - TEXT
  tier: 1
  group: Textual criticism & the CBGM
  cite: Peter Gurry · Brill, NTTSD 55 · 2017
  cost: paid — expensive
  free: false
  links:
  - - Brill
    - https://brill.com/display/title/35755
  - - Free summary article (PDF)
    - https://www.wisluthsem.org/rmdevser_wls/wp-content/uploads/2024/11/Gurry_Article-1.pdf
  why_this_one: The deepest critical treatment — sympathetic but unsparing on editor-dependence, the initial-text
    concept, and contamination handling; also the source of the “what did the CBGM actually change” counts
    your write-ups will cite.
  access_note: '**Brill pricing is hostile** — interlibrary loan is the move, or lean on the free summary
    article (also listed in Tier 2) if the price wall wins.'
- key: carlson
  title: “A Bias at the Heart of the CBGM” + Mink's reply
  url: https://acuresearchbank.acu.edu.au/item/8wx32/a-bias-at-the-heart-of-the-cbgm
  formats:
  - PAPER
  tier: 1
  group: Textual criticism & the CBGM
  cite: 'Stephen Carlson · JBL 139.2 (2020): 319–340 — with Gerd Mink''s guest-post response · INTF blog
    · 2020'
  cost: free
  free: true
  links:
  - - Open copy (ACU repository)
    - https://acuresearchbank.acu.edu.au/item/8wx32/a-bias-at-the-heart-of-the-cbgm
  - - Mink's reply (INTF blog)
    - https://ntvmr.uni-muenster.de/intfblog/-/blogs/remarks-on-carlson-a-bias-at-the-heart-of-the-cbgm-guest-post-by-gerd-mink-
  why_this_one: The dispute your simulation study adjudicates, in both principals' own words. Unit 6 reproduces
    the paper's counterexample in code; read both slowly, together.
  access_note: '**Free** — the JBL article via ACU''s repository, the reply on the INTF blog.'
- key: parker
  title: An Introduction to the New Testament Manuscripts and Their Texts
  url: https://www.cambridge.org/core/books/an-introduction-to-the-new-testament-manuscripts-and-their-texts/68450BA1F41A6C2C4023E9BDF52D8898
  formats:
  - TEXT
  tier: 1

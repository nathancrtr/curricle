resource_tiers:
- num: 1
  name: The core path
  role: Worked through substantially, in curriculum order. These ten are the course's spine — the meter
    above tracks them.
  compact: false
- num: 2
  name: Supplementary & deepening
  role: Pulled in on demand — when a write-up needs a citation anchor, a concept needs a second angle,
    or the price of a Tier-1 item wins.
  compact: false
- num: 3
  name: Data, tools & reference
  role: Looked up in, not read. Licenses noted — they matter to what the program may publish.
  compact: true
- num: 4
  name: Video & audio
  role: Where video genuinely helps — language habit-forming and statistics lectures.
  compact: false
phases:
- id: p0
  num: 0
  title: Orientation
  goal: Know what you're building and why; get the existing tooling running; start Greek.
  entries:
  - u0
  weeks:
  - 0
  - 2
- id: p1
  num: 1
  title: The CBGM from the inside
  goal: Understand the method by reimplementing its core, cross-validated against open-cbgm at every step.
    By the end you have a working mini-CBGM in Python and there is nothing mystical left in the acronym.
  entries:
  - u1
  - u2
  - u3
  - u4
  weeks:
  - 3
  - 10
  checkpoint:
    prose: You have reimplemented the CBGM's computational core and verified it against the reference
      implementation. You can define pregenealogical vs. genealogical coherence precisely, read a textual-flow
      diagram, and name exactly where human judgment enters the pipeline.
    quiz: q-phase-1
    track_goals:
    - - greek
      - Decker through ~ch. 8; you can parse articles and first/second-declension nouns and are reading
        the exercise sentences without dread.
- id: p2
  num: 2
  title: The critics and the dispute
  goal: Master the methodological debate your program adjudicates, and reproduce its central artifact.
    This phase is reading-heavier than the others — the write-ups in Phases 4–6 draw their related-work
    sections directly from it.
  entries:
  - u5
  - u6
  - u7
  - p2-mail
  weeks:
  - 11
  - 16
  checkpoint:
    prose: You can state both sides of the Carlson–Mink dispute in their strongest forms, you have reproduced
      its central example in running code, and your simulator's design is an itemized answer to "what
      would settle this?"
    track_goals:
    - - greek
      - Decker through ~ch. 14; verbs have arrived (present/imperfect); you're translating short LXX/NT
        sentences daily.
- id: p3
  num: 3
  title: Building the simulator
  goal: 'A synthetic-tradition pipeline, end-to-end into open-cbgm: generate a tradition with known history
    → export TEI → run the CBGM on it → score the answers against truth. This is capstone infrastructure;
    build it like production code.'
  entries:
  - u8
  - u9
  - u10
  - u11
  weeks:
  - 17
  - 26
  checkpoint:
    prose: 'You own an end-to-end laboratory: generate → corrupt → export → run CBGM → score against truth,
      all seeded and reproducible. Nobody has ever had this for the CBGM.'
    track_goals:
    - - greek
      - Decker through ~ch. 20 (aorist unlocked). **Start reading 1 John** alongside — a chapter a week
        with STEP Bible's tagged text; it will humble and then encourage you.
- id: p4
  num: 4
  title: The simulation study
  goal: 'Run the experiments, measure the Carlson effect honestly, compare rival methods on identical
    synthetic data, and publish deliverable #1.'
  entries:
  - u12
  - u13
  - u14
  weeks:
  - 27
  - 36
  checkpoint:
    prose: 'Deliverable #1 exists and is public. You can defend every number in it.'
    track_goals:
    - - greek
      - 'Decker finished or nearly (chs. ~28–33 are reference-grade; don''t stall on them); 1–3 John read
        in Greek; and — via the apparatus-trainer and die-bibel.de''s NA28 — you can decode an apparatus
        entry: witnesses, readings, the sigla that once looked like line noise.'
- id: p5
  num: 5
  title: The sensitivity study
  goal: 'Turn the perturbation machinery on the *real* ECM 3 John (and whatever the INTF licensing conversation
    opened up), and publish deliverable #2: how robust is a published critical text to its editors?'
  entries:
  - u15
  - u16
  - u17
  - u18
  weeks:
  - 37
  - 48
  checkpoint:
    prose: 'Deliverable #2 is public: the first published sensitivity analysis of the CBGM. You have read
      every unstable variation unit in Greek yourself.'
    track_goals:
    - - greek
      - intermediate reading (Mark with helps; Wallace as shelf reference); you can follow a *Textual
        Commentary* entry and have opinions about it.
- id: p6
  num: 6
  title: The philology apprenticeship → the LLM study
  goal: 'Become competent enough at transcriptional reasoning to evaluate an LLM doing it; then run the

manifest_version: 1
course:
  id: textual-flow
  title: Textual criticism & computational philology
  mode: research
  version:
    rev: '1.0'
    date: '2026-08-27'
    note: 'Companion documents: `learning-resources.md` (every source cited here, with access notes),
      `REVIEW.md` (research positioning), `exploration/` (how this program was chosen).'
  pacing:
    hours_per_week:
    - 3
    - 5
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
    review: REVIEW.md
    exploration: exploration/
  description: 'Learn New Testament textual criticism and computational philology by building a simulation
    & sensitivity laboratory for the CBGM — with Koine Greek alongside, start to finish.

    '
  capstone: u22
  trigger_phrases:
  - say: Teach me Unit 2 interactively.
    note: Socratic lessons exist for units 1, 2, 3, 4, 6, 8, 19; any other unit gets improvised from the
      curriculum.
  - say: Quiz me on Phase 1.
    note: live quizzing from the question bank, wrong answers taught, not just marked.
  - say: Drill me on Greek.
    note: alphabet rounds now; paradigms, parsing, and translate-checks as Decker advances.
  - say: Review my Unit 7 design doc — tear it apart.
  - say: My numbers disagree with open-cbgm. Help me find who's wrong.
  - say: Draft the INTF email with me.
    note: the Phase 2 contact milestone (drafting together; sending is yours).
  storage_key: tf-progress

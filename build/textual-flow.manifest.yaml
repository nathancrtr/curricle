units:
- id: u0
  num: 0
  phase: p0
  title: Orientation
  rows:
  - label: Build
    content: 'Clone and build [open-cbgm](https://github.com/jjmccollum/open-cbgm) (and `open-cbgm-standalone`).
      Run the full pipeline on the bundled ECM **3 John** collation (137 witnesses × 116 variation units):
      populate the cache, print a witness comparison, generate one textual-flow diagram and the global
      stemma. Don''t understand it yet — just make it run and look at every output artifact.'
  - label: Read
    content: this repo's `README.md` and `REVIEW.md` (where this program sits in the field); `exploration/convergence.md`
      (why these questions); Wasserman & Gurry, *A New Approach to Textual Criticism*, front matter +
      ch. 1 — and skim the whole book fast (~100 pp.) for shape, not mastery.
  - label: Concepts
    content: why "the original text" became "the initial text (*Ausgangstext*)"; the CBGM pipeline at
      cartoon level (local decisions → coherence → textual flow → global stemma); what an ECM variation
      unit is; what this program will do to that pipeline (perturb it, simulate it, imitate its human
      layer).
  - label: Greek track
    content: 'the alphabet until it''s boring. Decker, *Reading Koine Greek* chs. 1–2; write the alphabet
      daily; pick a pronunciation and stop worrying about it (Erasmian if you want to match Mounce/Daily
      Dose materials; reconstructed Koine if your linguist''s conscience insists — Decker discusses the
      options). Set up the Anki deck. The boring machine: `interactive/quizzes/greek-alphabet-trainer.html`
      — reference table + four streak drills.'
    track: greek
  - label: Milestone
    content: 'open-cbgm outputs in hand for 3 John; a paragraph in your own words: what does the CBGM
      take in, what does it emit, and where in that pipe do humans sit?'
  - label: Interactive
    content: quiz `interactive/quizzes/phase-0-checkpoint.html` — take it after the skim; it grades the
      milestone paragraph's ingredients.
  gloss: Make open-cbgm run on 3 John, skim the map of the field, start the alphabet — and say in one
    paragraph where the humans sit in the pipe.
  provenance: bespoke
  steps:
  - id: p0-run
    label: open-cbgm built & run on 3 John, every output eyeballed
  - id: p0-read
    label: W&G front matter + fast skim; README + REVIEW read
  - id: p0-para
    label: 'Milestone paragraph: in, out, where the humans sit'
  check:
    q: The CBGM is often called a method for "reconstructing the stemma of the New Testament." Its own
      inventor denies this. Before Phase 1 — what *does* it claim to reconstruct, if not a stemma of manuscripts?
    ans: Relationships between the *texts* carried by witnesses, not the *manuscripts* themselves. A 14th-century
      manuscript can carry a very ancient text. The distinction — texts flow through manuscripts but aren't
      identical to them — is the method's founding move, and Unit 1 makes it precise.
- id: u1
  num: 1
  phase: p1
  title: Witnesses, variants, and the shape of the data
  rows:
  - label: Build
    content: 'A TEI collation parser. Read the 3 John TEI XML from open-cbgm''s `examples/`; parse it
      (lxml or ElementTree) into your own model: `VariationUnit`, `Reading`, `Witness`, attestations.
      Print summary tables: units per chapter, readings per unit, coverage per witness (lacunae!).'
  - label: Read
    content: Wasserman & Gurry ch. 1 carefully this time; Parker, *An Introduction to the NT Manuscripts
      and Their Texts*, the chapters on what manuscripts are and how an edition is made (Parts I–II selectively);
      the TEI Critical Apparatus module docs as reference while parsing.
  - label: Concepts
    content: witness, reading, variation unit, lacuna, correction hands (424C!); positive vs. negative
      apparatus; why "witness" ≠ "manuscript" (versions, fathers); the ECM as data, not book.
  - label: Exercise
    content: 'Answer from your parser, with code: which witness has the most lacunose text of 3 John?
      Which variation unit has the most readings? How many units are binary?'
  - label: Milestone
    content: '`parse_collation()` with tests; the summary tables committed as a notebook or doc.'
  - label: Key insight
    content: A critical apparatus is a *sparse matrix with an opinionated schema* — witnesses × units,
      mostly empty, every cell a philological judgment. You've spent a career normalizing other people's
      opinionated schemas; this one is just older.
    kind: key
  - label: Interactive
    content: lesson `interactive/lessons/unit-01-collation-data-model.md`; starter `interactive/exercises/unit-01-starter/`
      — the toy tradition as TEI, 12 failing tests, and the oracle is unit-02's fixture (same tradition,
      two encodings — your parser proves it).
  gloss: Parse the ECM's TEI into your own data model — and meet the apparatus as a sparse matrix with
    an opinionated schema.
  provenance: bespoke
- id: u2
  num: 2
  phase: p1
  title: Pregenealogical coherence
  rows:
  - label: Build
    content: 'Implement percentage agreement: for every witness pair, agreements / jointly-extant units.
      Produce each witness''s ranked "closest relatives" table. **Cross-validate:** open-cbgm''s witness
      comparison output for the same pairs must match your numbers.'
  - label: Read
    content: Wasserman & Gurry, the pregenealogical coherence chapter; the INTF *Genealogical Queries*
      guide (`intf.uni-muenster.de/cbgm2/guide_en.html`), "comparison of witnesses" and "potential ancestors"
      modules — then use the live tool at `ntg.uni-muenster.de` on the Catholic Letters and find the same
      witnesses you've been computing.
  - label: Concepts
    content: pregenealogical = *no direction yet*, pure similarity; why percentages (not raw counts) —
      the lacunae problem; coherent vs. incoherent attestation; connectivity as "how many relatives count
      as close."
  - label: Exercise
    content: '`interactive/exercises/unit-02-starter/` — a stub + failing tests over a small fixture collation
      with hand-computed expected values. Make them pass, then point the same code at real 3 John.'
  - label: Milestone
    content: Green tests; your agreement matrix matches open-cbgm; you can say what it means that 01 and
      03 are (or aren't) close in 3 John.
  - label: Interactive
    content: lesson `interactive/lessons/unit-02-pregenealogical-coherence.md`; widget `interactive/widgets/coherence-explorer.html`
      (the toy tradition — inspect its agreement pane now, ignore the rest until Units 3–4).
  gloss: Percent agreement over jointly extant units — the pure-similarity layer that deliberately claims
    no direction.
  provenance: bespoke
- id: u3
  num: 3
  phase: p1
  title: Local stemmata and genealogical coherence
  rows:
  - label: Build
    content: 'Extend the parser to read the local stemmata encoded in the TEI (`<graph>` elements). Implement
      the genealogical comparison: for each witness pair (W1, W2), count units where W1''s reading is
      prior, posterior, equal, or unrelated per the local stemma. Derive potential-ancestor rankings.
      Cross-validate against open-cbgm.'
  - label: Read
    content: 'Mink, "Contamination, Coherence, and Coincidence" (in Wachtel & Holmes, *The Textual History
      of the Greek NT*) — first pass: read for the *definitions* (local stemma, coherence, potential ancestor),
      skip the worked examples; you''ll return in Unit 5. Wasserman & Gurry''s corresponding chapter as
      the gentler parallel text.'
  - label: Concepts
    content: a local stemma is a *directed graph over readings, not witnesses* — the single most commonly
      confused point in the entire method; how thousands of tiny directed judgments aggregate into witness-level
      directionality; "potential ancestor" as a statistical, not historical, claim; the iterative loop
      (local decisions → coherence → revised local decisions) and why critics call it circular while Mink
      calls it hermeneutic.
  - label: Exercise
    content: Pick three 3 John variation units. From the TEI, draw their local stemmata by hand. Then
      find one witness pair whose ancestor-direction flips if you reverse *one* local stemma — compute
      it.
  - label: Milestone
    content: Potential-ancestor tables matching open-cbgm; your hand-worked flip example written up (it
      is the sensitivity study in embryo — keep it).
  - label: Key insight
    content: 'The local stemma layer is ~*n* thousand independent human judgments feeding one aggregation
      function. You have seen this architecture before: labeled training data feeding a model. Phase 6
      takes that analogy literally.'
    kind: key
  - label: Interactive
    content: lesson `interactive/lessons/unit-03-local-stemmata.md`; the widget's local-stemma toggles
      now make sense — flip arrows and watch the ancestor rankings move.
  gloss: Thousands of per-unit directed judgments aggregate into witness-level ancestry — and one flipped
    arrow can make a tie.
  provenance: bespoke
- id: u4
  num: 4
  phase: p1
  title: Textual flow, connectivity, and the initial text
  rows:
  - label: Build
    content: Generate textual-flow diagrams from your own data structures (emit Graphviz DOT) for a "perfectly
      coherent" unit and a fragmented one. Implement the connectivity parameter and show how a flow diagram
      changes at connectivity 5 vs. 499. Reproduce one diagram that matches open-cbgm's.
  - label: Read
    content: Wasserman & Gurry, the textual flow + initial text chapters; the *Genealogical Queries* guide's
      coherence-at-variant-passages module, used live against your diagrams.
  - label: Concepts
    content: textual flow as "for this attestation, where did the reading most plausibly flow from, given
      global coherence"; connectivity as a *prior on transmission promiscuity*; the initial text A as
      a witness-like construct; why the ECM editors sometimes print a split (diamond) — editorial abstention
      as data.
  - label: Exercise
    content: Find a 3 John unit where the attestation of some reading is *incoherent* (supporters aren't
      close relatives). What are the two possible historical stories, and which does the flow diagram
      favor at each connectivity setting?
  - label: Milestone
    content: 'Your mini-CBGM produces flow diagrams; a short note: "the three dials a human sets in this
      method are ___" (local stemmata, connectivity, witness selection — you''ll spend Phase 5 turning
      them).'
  - label: Interactive
    content: lesson `interactive/lessons/unit-04-textual-flow.md`; widget `interactive/widgets/flow-explorer.html`
      (the toy tradition's flow diagrams with the connectivity dial — the u3 experiment is the unit in
      miniature); then quiz `interactive/quizzes/phase-1-checkpoint.html`.
  gloss: Flow diagrams, the connectivity prior, and the reconstructed witness A — where the editors' dials
    live.
  provenance: bespoke
- id: u5
  num: 5
  phase: p2
  title: The case for and against
  rows:
  - label: Build
    content: 'Nothing new — annotate. Maintain a `notes/dispute.md` capturing every *testable* claim you
      encounter, in a table: claim · source · what data would decide it.'
  - label: Read
    content: Gurry, *A Critical Examination of the CBGM*, the chapters on the method's assumptions and
      its effect on the text (his count of NA28 changes); Mink's "Contamination, Coherence, and Coincidence,"
      second pass — now the worked examples; Hixson & Gurry (eds.), *Myths and Mistakes*, ch. on "myths
      about variants" for calibration on effect sizes.
  - label: Concepts
    content: contamination as the method's *raison d'être* and its Achilles' heel; editor-dependence (GIGO
      surface); the "initial text" debate (Epp); what the CBGM changed in practice (~34 Catholic-Letters
      decisions) vs. the rhetoric around it.
  - label: Exercise
    content: From Gurry's list of NA28 changes in the Catholic Letters, pick two, look them up in *Genealogical
      Queries*, and reconstruct in one paragraph each why coherence tipped the editors.
  - label: Milestone
    content: '`notes/dispute.md` with ≥10 testable claims — this is the requirements document for your
      simulator.'
  gloss: The critics read closely, both sides at full strength — and every testable claim goes into dispute.md.
  provenance: bespoke
- id: u6
  num: 6
  phase: p2
  title: Carlson's bias argument, reproduced
  rows:
  - label: Build
    content: 'Encode Carlson''s 5-witness, 18-passage counterexample (JBL 2020) as a TEI collation. Run
      it through open-cbgm *and* your mini-CBGM. Reproduce the misordering: the potential-ancestor criterion
      demoting the faithful copyist of an old exemplar.'
  - label: Read
    content: Carlson, "A Bias at the Heart of the CBGM" (JBL 139.2, open copy via ACU repository); Mink's
      reply ("Remarks on Carlson," INTF blog, 2020); both slowly, with your `dispute.md` open.
  - label: Concepts
    content: '*why* the bias arises (a witness preserving many superseded-but-prior readings looks "posterior
      on average"); Mink''s two defenses (illegitimate hypothetical witnesses; wrong module tested) and
      what each would predict *if the experiment were run properly* — which nobody has done, which is
      Unit 12.'
  - label: Exercise
    content: 'Perturb Carlson''s example: how small can you make it and keep the misordering? At what
      mixture rate does it disappear? (Hand exploration now; the grid comes in Phase 4.)'
  - label: Milestone
    content: '`carlson-2020/` directory in the repo: the encoded example, a script, a README showing the
      reproduced effect. Six years dormant, now executable — this artifact alone is worth a blog post.'
  - label: Interactive
    content: lesson `interactive/lessons/unit-06-carlson-bias.md`.
  gloss: The 2020 counterexample, encoded as TEI and re-run — dormant six years, now executable.
  provenance: bespoke
- id: u7
  num: 7
  phase: p2
  title: Stemmatology beyond the NT
  rows:
  - label: Build
    content: 'Skeleton of the simulator package (`textual_flow/simulate/`): empty modules, interfaces,
      and a design doc mapping the artificial-tradition literature''s choices (tradition size, loss rate,
      mixture model) onto constructor parameters.'
  - label: Read
    content: '*Handbook of Stemmatology* (open access), ch. 5 (computational methods) and the sections
      on evaluation with artificial traditions; Roos & Heikkilä (LLC 2009) for the benchmark idea; Camps
      & Randon-Furling, "Lost Manuscripts and Extinct Texts" (arXiv) as the generative-model template;
      skim Hyytiäinen–McCollum–Finney (DSH 2026) to see the state of the art on *real* data and confirm
      what it lacks (ground truth).'
  - label: Concepts
    content: stemma vs. phylogeny vs. network; contamination breaks trees; artificial traditions as the
      field's own answer to "how would we know a method works?"; birth–death processes as an engineer's
      model of copying-and-loss.
  - label: Exercise
    content: 'Write the design doc''s key table: every parameter of your future simulator, its range,
      and which *published claim* from `dispute.md` it exists to test.'
  - label: Milestone
    content: 'Design doc reviewed (bring it to Claude: "tear this apart"); simulator skeleton committed.'
  gloss: What the wider field learned about validating methods on artificial traditions — and the simulator's
    design doc.
  provenance: bespoke
- id: u8
  num: 8
  phase: p3
  title: Transmission as a generative process
  rows:
  - label: Build
    content: '`simulate/tradition.py`: a birth–death copying process over a timeline — manuscripts are
      created by copying an extant exemplar, survive, decay, are lost; a sampling step decides which survive
      to be "extant witnesses." Pure tree mode first (single exemplar per copy). Parameters: birth/death
      rates, timeline length, target extant count.'
  - label: Read
    content: Camps & Randon-Furling (both papers) — for the model family and for honest priors on loss
      rates; your own design doc.
  - label: Concepts
    content: the *true stemma* as a byproduct of generation; why massive loss (>90% of medieval traditions)
      makes reconstruction hard *in principle*; seeding and reproducibility discipline for simulation
      science (every tradition regenerable from a config + seed).
  - label: Exercise
    content: '`interactive/exercises/unit-08-starter/` — property tests for the generator (every witness
      has exactly one parent in tree mode; the true stemma is acyclic; extant count hits target; agreement
      decays with stemmatic distance). Make them pass.'
  - label: Milestone
    content: Traditions generating; a gallery of five true stemmata rendered via Graphviz at different
      loss rates.
  - label: Interactive
    content: widget `interactive/widgets/transmission-simulator.html` — the browser version of what you
      just built; use it to *feel* the parameter space before you sweep it. Lesson `interactive/lessons/unit-08-simulation-design.md`.
  gloss: A birth–death copying process that produces manuscript traditions with their true history attached.
  provenance: bespoke
- id: u9
  num: 9
  phase: p3
  title: Mutation, readings, and the oracle editor
  rows:
  - label: Build
    content: '`simulate/mutation.py`: variation units arise by copying errors — per-copy mutation probability,
      reading multiplicity, back-mutation/coincidental agreement rate. Then `simulate/oracle.py`: the
      **oracle editor** — emits local stemmata for each unit from the *true* reading genealogy, corrupted
      at error rate ε (flip a direction, merge readings, declare "unclear") — because the real CBGM never
      sees truth, only an editor''s judgment of it.'
  - label: Read
    content: 'Nothing new — this unit is pure design + code. Revisit `dispute.md`: which claims need which
      corruption modes.'
  - label: Concepts
    content: 'ε as *the* bridge parameter: it models editorial fallibility in simulation, it is what Phase
      5 perturbs on real data, and it is what Phase 6 measures empirically with an LLM. One parameter,
      three studies.'
  - label: Exercise
    content: 'Generate a 20-witness tradition; hand-check three units: does the emitted local stemma at
      ε=0 match the true reading history? At ε=0.2, what kinds of lies does the oracle tell?'
  - label: Milestone
    content: Full synthetic collations with ground-truth sidecar files (true stemma, true initial text,
      true ancestor relations per pair).
  gloss: Copying errors create readings; the oracle editor reports the truth corrupted at rate ε — one
    parameter, three studies.
  provenance: bespoke
- id: u10
  num: 10
  phase: p3
  title: TEI export and the validation loop
  rows:
  - label: Build
    content: '`simulate/export.py`: synthetic tradition → TEI XML in open-cbgm''s dialect (your Unit-1
      parser round-trips it — test that). Then the moment of truth: open-cbgm consumes a synthetic tradition
      and emits its answers. `score.py`: initial-text recovery rate, potential-ancestor rank correlation
      (Kendall τ against true ancestor sets), flow-diagram edge accuracy.'
  - label: Read
    content: open-cbgm's README/design paper for its TEI expectations; teiphy's docs (you'll want its
      format conversions in Unit 13).
  - label: Concepts
    content: 'the validation question stated properly: *on clean tree-shaped data with a perfect editor,
      the CBGM should shine* — establishing that it does is not a gotcha, it''s the calibration every
      later result rests on.'
  - label: Exercise
    content: Run the loop at ε=0, no contamination, three tradition sizes. Does the CBGM recover the initial
      text? Where does recovery degrade first as loss increases?
  - label: Milestone
    content: '**The pipeline**: one command from config+seed to scored CBGM performance. This is the machine
      the papers come from.'
  gloss: 'Synthetic tradition → TEI → open-cbgm → scored against truth: one command, and the machine the
    papers come from.'
  provenance: bespoke
- id: u11
  num: 11
  phase: p3
  title: Contamination
  rows:
  - label: Build
    content: '`simulate/contamination.py`: block mixture (change of exemplar mid-text) and per-reading
      mixture (sporadic correction against a second exemplar), each at configurable rates; the true history
      records every mixture event.'
  - label: Read
    content: 'Mink''s contamination sections, third visit — now as an adversary: what does his method
      *predict* it can survive? The *Handbook*''s contamination discussion.'
  - label: Concepts
    content: why contamination breaks tree methods structurally; coherence as Mink's wager that it's survivable
      statistically; simulating the thing a method claims to handle is the sharpest test available.
  - label: Exercise
    content: Reproduce, in one synthetic tradition, the qualitative shape of Carlson's counterexample
      — a faithful copy of an old exemplar in a contaminated neighborhood — *without* hand-construction.
      If you can generate it, you can measure its frequency.
  - label: Milestone
    content: Contamination modes tested and documented; the experiment grid for Phase 4 written down and
      (lightly) pre-registered — declare your metrics and hypotheses in the repo *before* running the
      sweep.
  gloss: Block and per-reading mixture, with every event recorded — simulate the thing the method claims
    to survive.
  provenance: bespoke
- id: u12
  num: 12
  phase: p4
  title: The Carlson experiment at scale
  rows:
  - label: Build
    content: 'The sweep: contamination rate × ε × tradition size × loss rate, N seeds per cell. Metric
      of record: how often, and how badly, does the potential-ancestor criterion misorder witnesses of
      Carlson''s type (defined mechanically from true history)? Plus the global metrics from Unit 10.'
  - label: Read
    content: Nothing new. Rerun your pre-registration checklist before looking at results.
  - label: Concepts
    content: effect size over anecdote; when a hand-built counterexample generalizes and when it's a corner
      case — the answer is an empirical distribution now, not a debate.
  - label: Exercise
    content: Before the sweep finishes, write down (sealed) what you expect Mink's and Carlson's predictions
      to be per cell. Score both afterward.
  - label: Milestone
    content: 'The results notebook: the bias measured as a function of contamination and ε. Whatever it
      shows, it''s the first of its kind.'
  gloss: 'The sweep: how often, and how badly, does the potential-ancestor criterion misorder Carlson-type
    witnesses?'
  provenance: bespoke
- id: u13
  num: 13
  phase: p4
  title: Rivals on the same ground truth
  rows:
  - label: Build
    content: teiphy-convert your synthetic collations; run Bayesian phylogenetics (BEAST 2) and a distance
      method (NeighborNet via SplitsTree) on the same traditions; score all three families against truth
      with the same metrics.
  - label: Read
    content: Taming the BEAST, the introductory tutorial + one dated-tips tutorial; McCollum & Turnbull
      (DSH 2024) as the worked example of BEAST-on-collation; McElreath *Statistical Rethinking* chs.
      1–2 (and the 2023/2026 lectures) if Bayesian machinery feels like folklore — his simulation-first
      style is exactly your Phase 3 instinct applied to statistics.
  - label: Concepts
    content: 'what a posterior over trees even is; clock models in one paragraph; the crucial scoping
      note from `REVIEW.md`: rivals-on-*real*-data is published five times over — rivals-on-*synthetic*-data
      is yours.'
  - label: Exercise
    content: 'One tradition, three methods, one page: where do they agree, where does each fail, and does
      failure correlate with the contamination you injected?'
  - label: Milestone
    content: The comparison table across the grid. (BEAST runs are overnight-scale; batch them.)
  gloss: BEAST and NeighborNet on the same synthetic traditions — three method families scored on identical
    truth.
  provenance: bespoke
- id: u14
  num: 14
  phase: p4
  title: 'Write-up #1'
  rows:
  - label: Build
    content: 'The paper: "Running the CBGM on synthetic traditions with known ground truth." Structure:
      calibration (it works on clean data) → the measured Carlson effect → contamination limits → method
      comparison → what this does and doesn''t say about the NT text (reception rules!).'
  - label: Read
    content: 'Two models of tone: the Hyytiäinen–McCollum–Finney DSH paper; Carlson''s JBL piece. Note
      how each earns its claims.'
  - label: Concepts
    content: 'the venue ladder (`exploration/candidates/05` §5): preprint → *TC* or *DSH*; ETC-blog summary
      for the field''s attention; McCollum and Carlson get courtesy previews (you have their attention
      from Phase 2).'
  - label: Milestone
    content: Preprint out. **This is the program's "move within a year" commitment kept** (convergence
      doc, action 3).
  - label: Interactive
    content: quiz `interactive/quizzes/apparatus-trainer.html` — because the Greek track now needs it
      (below).
  gloss: 'Paper #1: calibration, the measured bias, contamination limits — and what it does and doesn''t
    say about the NT.'
  provenance: bespoke
- id: u15
  num: 15
  phase: p5
  title: The perturbation harness
  rows:
  - label: Build
    content: '`sensitivity/`: scripted perturbation of real collation inputs — local-stemma flips at 5/10/20%
      (stratified: units the editors marked split/uncertain first — their own confidence is your prior),
      connectivity sweeps (absolute and quantile), witness leave-one-out and bootstrap, variation-unit
      bootstrap. Driver over open-cbgm''s CLI with the SQLite cache.'
  - label: Read
    content: Your own Unit-3 flip example (told you to keep it); `exploration/candidates/05` §1 for the
      four wobble metrics; Knight's corrections problem (JBL 2019) for one perturbation mode reviewers
      will ask about.
  - label: Concepts
    content: anchoring perturbation rates in *observed* editorial disagreement (ECM1→ECM2 revisions, NA28↔THGNT
      differences) so no one can call them arbitrary.
  - label: Exercise
    content: 'First real result: at a 10% flip rate on low-confidence units, how many of 3 John''s 116
      initial-text decisions ever flip across 500 runs? Which ones, and are the editors'' diamonds among
      them?'
  - label: Milestone
    content: The harness, tested; first wobble distributions plotted.
  gloss: 'Scripted perturbation of the real inputs: stemma flips, connectivity sweeps, witness and unit
    bootstraps.'
  provenance: bespoke
- id: u16
  num: 16
  phase: p5
  title: Wobble metrics and the headline table
  rows:
  - label: Build
    content: 'The full metric suite from the pre-registration: (i) initial-text decision stability, (ii)
      potential-ancestor rank stability (Kendall τ), (iii) flow-diagram edge stability, (iv) substemma/global-stemma
      stability. One table: *dial turned → what moves, how much*.'
  - label: Read
    content: Mink's rebuttal once more — perturb through to the substemma/global-stemma layer, because
      "you tested the wrong module" is the rebuttal you already know is coming.
  - label: Concepts
    content: robustness as a *property of specific decisions*, not the method wholesale — expect (and
      want) the result "most decisions are rock-solid; these N are editorially load-bearing."
  - label: Exercise
    content: 'For the three least stable variation units: read them. In Greek. What is actually at stake
      in each (a particle? a christological clause?) — this paragraph is what guild readers will quote.'
  - label: Milestone
    content: The headline table; the Greek-informed close reading of the fragile units.
  gloss: 'Four stability metrics, one table: dial turned → what moves, how much — read the fragile units
    in Greek.'
  provenance: bespoke
- id: u17
  num: 17
  phase: p5
  title: Scale and scope (conditional)
  rows:
  - label: Build
    content: 'If INTF said yes (Phase 2 contact): extend to Acts/Mark/Revelation via the Genealogical
      Queries API data (~17,500 more units); the harness was built for this. If not: deepen 3 John + Catholic
      Letters (GQ 2.0) and document the constraint honestly.'
  - label: Read
    content: '`exploration/candidates/04` §3 (the API inventory — endpoints, counts).'
  - label: Milestone
    content: The study at its final scope; data/license provenance documented to publication standard.
  gloss: 'If INTF said yes: Acts, Mark, Revelation (~17,500 more units). If not: deepen 3 John and document
    the constraint honestly.'
  provenance: bespoke
  condition:
    'on': INTF licensing answer
    state: pending
- id: u18
  num: 18
  phase: p5
  title: 'Write-up #2'
  rows:
  - label: Build
    content: '"How robust is the ECM text to its editors'' judgments?" — sensitivity results framed by
      the simulation study''s calibration (paper #1 tells you what wobble *means*; that pairing is the
      program''s unfair advantage).'
  - label: Milestone
    content: 'Preprint #2 out; ETC-blog summary; the INTF gets first sight as promised.'
  gloss: 'Paper #2: how robust is the ECM text to its editors'' judgments — framed by paper #1''s calibration.'
  provenance: bespoke
- id: u19
  num: 19
  phase: p6
  title: Transcriptional probability, by hand
  rows:
  - label: Build
    content: Nothing yet — *you* are the system under training. For 20 of 3 John's variation units (sampled
      across difficulty), construct local stemmata by hand, with written rationales in the discipline's
      vocabulary, *before* looking at the editors'. Score yourself with the metrics you'll later apply
      to the model.
  - label: Read
    content: Royse, *Scribal Habits*, the summary chapter + one papyrus chapter (the $92 pain is worth
      it; the library may help); Metzger, *Textual Commentary*, 15 entries as worked examples — always
      committing your own judgment first; Willker's *Textual Commentary* (free) for second opinions; Hixson
      & Gurry for base-rate sanity.
  - label: Concepts
    content: harmonization, homoioteleuton, itacism, Atticism, *lectio brevior/difficilior* and its modern
      demotion (Royse!), assimilation to parallels; the committee's reasoning genre.
  - label: Exercise
    content: 'Your 20 hand-built stemmata vs. the editors'': agreement rate, and a written analysis of
      every disagreement. This number — *your* ε — is the human baseline for Unit 21.'
  - label: Milestone
    content: The annotated 20; you now know from the inside what the LLM is being asked to do.
  - label: Interactive
    content: lesson `interactive/lessons/unit-19-transcriptional-probability.md`.
  gloss: Twenty local stemmata built by hand, before looking at the editors' — your own ε, measured.
  provenance: bespoke
- id: u20
  num: 20
  phase: p6
  title: The task, the data, the traps
  rows:
  - label: Build
    content: '`local_stemma/`: harvest variation units (3 John TEI + whatever GQ scope is licensed); shuffle
      reading labels (the "a = initial text" leak); compute the **trivial-star baseline** (how many editorial
      stemmata are just `* → a → rest`? — this number gates the whole study); memorization probes (can
      the model recite ECM apparatus? Metzger-famous vs. long-tail stratification).'
  - label: Read
    content: '`exploration/candidates/04` §1 (task definition, evaluation design, the three traps: circularity,
      iteration leakage, label leakage); Logion and Ithaca papers as the genre''s exemplars.'
  - label: Concepts
    content: predicting editors ≠ predicting truth — the honest framing is *reproducibility of editorial
      judgment by an independent reasoner*; why high agreement and structured disagreement are both publishable.
  - label: Milestone
    content: Dataset built; baselines and probes run; evaluation pre-registered.
  gloss: Dataset built, labels shuffled, the trivial-star floor computed, memorization probed — the traps
    built out before the run.
  provenance: bespoke
- id: u21
  num: 21
  phase: p6
  title: The experiment
  rows:
  - label: Build
    content: 'Prompted frontier-LLM runs: local-evidence-only vs. +coherence-summary vs. +transcriptional-checklist
      conditions; parse responses to digraphs; score (edge P/R/F1, root accuracy, calibrated abstention
      vs. editorial diamonds); stratify by fame, difficulty, and unit type.'
  - label: Read
    content: Nothing new. Spend the hours on error analysis instead.
  - label: Exercise
    content: 'For 50 disagreements, the Greek-heavy heart: is the model''s transcriptional story philologically
      coherent even where it differs from the editors? Categorize: model-wrong / defensible-alternative
      / editors-should-look-again.'
  - label: Milestone
    content: Results in; the disagreement taxonomy drafted.
  gloss: The prompted runs across three evidence conditions, scored — and the disagreement taxonomy that
    is the study's heart.
  provenance: bespoke
- id: u22
  num: 22
  phase: p6
  title: 'Write-up #3 and the capstone close-out'
  rows:
  - label: Build
    content: '"Can a language model reconstruct the ECM''s local stemmata?" — with the Unit-19 human baseline,
      the trivial-star floor, memorization stratification, and the triage-instrument framing (the ECM''s
      John and Paul volumes are being edited *now*; a validated disagreement queue has a live customer).
      Then the capstone synthesis: a `PROGRAM.md` retrospective connecting all three deliverables to the
      question you started with — what do we now know about the CBGM''s robustness that nobody knew two
      years ago?'
  - label: Milestone
    content: 'Preprint #3; `PROGRAM.md`; update `REVIEW.md` to reflect what the program actually established.
      **Capstone complete.**'
  - label: SQ1 (during Phase 2)
    content: 'Benchmark schema + annotation manual: encode Cooper Smith''s eight direction-of-dependence
      criteria (JHS 2023, open) as a formal annotation schema; design the disagreement-as-data record
      format (per-scholar attribution). No Hebrew needed.'
  - label: SQ2 (during Phase 3)
    content: 'Null-model prototype: genre-stratified, rarity-weighted permutation test for chance lexical
      overlap, built on transliterated/lemmatized text via WLC + MACULA identifiers. Pure engineering.'
  - label: SQ3 (during Phase 4)
    content: 'Outreach: emails to David Smiley and the intertextual.bible curator — the schema and null
      model give you something concrete to show. Their responses decide whether this becomes a collaboration,
      a Phase-7 program, or a graceful release.'
  gloss: 'Paper #3 with its baselines and floors, then PROGRAM.md: what do we now know that nobody knew
    two years ago?'
  provenance: bespoke

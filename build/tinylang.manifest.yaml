manifest_version: 1
course:
  id: tinylang
  title: Interpreters, end to end
  mode: project
  version:
    rev: '1.0'
    date: '2026-08-30'
    note: initial version, written as curricle's shipped example course.
  pacing:
    hours_per_week:
    - 4
    - 4
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
  description: Learn how interpreters work by building tinylang — a small dynamically-typed language with
    functions, closures, and a REPL — from raw characters through to a running program.
  capstone: u4
  trigger_phrases:
  - say: Teach me Unit 2 interactively.
    note: a Socratic lesson guide exists for Unit 1; other units get improvised from the curriculum.
  - say: Quiz me on Phase 1.
    note: draws from the Phase 1 checkpoint quiz, teaching wrong answers rather than just marking them.
  - say: My parser gets the precedence wrong. Help me find where.
  - say: Review my evaluator — tear it apart.
  storage_key: tinylang-progress
  preamble:
  - Learn how interpreters work **by building tinylang** — a small dynamically-typed language with functions,
    closures, and a REPL — from raw characters through to a running program. For an experienced engineer
    at ~4 hrs/week; roughly 8 weeks, in phases that each stand alone.
  - 'This is the example course that ships with curricle. It is deliberately small — four units and two
    phases — but it is a real course, not a fixture: it exercises every part of the manifest schema (tracks,
    milestones, materials, graders, all four reference schemes) and it compiles clean. Copy this directory
    and start editing when you want a course of your own.'
  - '## How this curriculum works'
  - '**The interpreter is the spine.** Every unit adds one stage to a pipeline that already runs end to
    end. By the end of Unit 1 you can turn source text into tokens; by the end of Unit 4 you can define
    a closure and call it. Nothing is scaffolding that gets thrown away.'
  - '**Each unit has:** Build (the implementation step) · Read (precise sources — see `learning-resources.md`
    for every citation) · Concepts · Exercise · Milestone, and sometimes a Key insight. The Interactive
    row is not written here — it is derived from the material registry in `course.yaml`, so a widget or
    a lesson appears on the unit page as soon as it is registered.'
  - '**Pacing.** One unit ≈ two weeks at four hours. Unit 2 (parsing) is the long one; Unit 3 is the one
    that suddenly feels like magic. Phases end with checkpoints; if a checkpoint feels shaky, camp there.'
  - '**Tests are your grader.** From Unit 1 onward you keep a test suite. The house style: test the shapes
    and the invariants rather than exact strings, so a change to error formatting doesn''t turn twenty
    tests red at once.'
  - '**Working with Claude.** *"Teach me Unit 2 interactively"* runs the Socratic lesson guide; *"quiz
    me on Phase 1"* draws from the checkpoint quiz.'
  resources_intro: '**Tier 1** is the core path, worked through in curriculum order. **Tier 2** is a second
    voice on the same material, for when one explanation doesn''t land. **Tier 3** is reference — looked
    up in, not read. Every entry says *why this one*. The core path is free; the one paid entry is optional
    and labelled as such.'
  reading_order:
  - Crafting Interpreters, chapter by chapter alongside Units 0–4 (the spine)
  - Pratt's binding-power article once Unit 2's precedence cascade starts to itch
  - Python's tokenize and ast docs as reference, from Unit 1 onward
  - Writing an Interpreter in Go, optionally, as a second pass in another voice
tracks:
- id: theory
  name: Formal grammars
  stages:
  - id: t-regular
    label: regular languages
    goal: Recognise what a lexer can and cannot decide.
  - id: t-cfg
    label: context-free grammars
    goal: Read a grammar in BNF and write one for a small expression language.
  - id: t-semantics
    label: semantics
    goal: State what an evaluator computes, precisely enough to argue about it.
  cadence: ~30 min/wk, alongside the build
  row_labels:
  - Theory track
  checkpoint_labels:
  - Theory by now
resources:
- key: crafting
  title: Crafting Interpreters
  url: https://craftinginterpreters.com/
  formats:
  - TEXT
  - CODE
  tier: 1
  group: Building interpreters
  cite: Robert Nystrom · Genever Benning · 2021
  cost: free online
  free: true
  links:
  - - Read online
    - https://craftinginterpreters.com/
  why_this_one: The spine of this course, and the rare technical book that is both complete and enjoyable.
    It builds two full interpreters — a tree-walker and a bytecode VM — with every line of code on the
    page and every design decision argued rather than asserted. The whole of Phases 0–2 hangs off its
    first half.
  access_note: Free in full online; the print and ebook editions are the same text if you prefer paper.
- key: pratt
  title: '“Pratt Parsers: Expression Parsing Made Easy”'
  url: https://journal.stuffwithstuff.com/2011/03/19/pratt-parsers-expression-parsing-made-easy/
  formats:
  - TEXT
  tier: 1
  group: Building interpreters
  cite: Robert Nystrom · journal.stuffwithstuff.com · 2011
  cost: free
  free: true
  links:
  - - Read online
    - https://journal.stuffwithstuff.com/2011/03/19/pratt-parsers-expression-parsing-made-easy/
  why_this_one: Unit 2's technique, in one sitting. Recursive descent handles precedence with a cascade
    of near-identical functions; Pratt parsing replaces the cascade with a table of binding powers that
    you extend by adding a row. Read it after feeling the repetition it removes — the argument doesn't
    land before then.
- key: interpreterbook
  title: Writing an Interpreter in Go
  url: https://interpreterbook.com/
  formats:
  - TEXT
  - CODE
  tier: 2
  group: Building interpreters
  cite: Thorsten Ball · 2018
  cost: paid ~$35 (with its sequel)
  free: false
  links:
  - - Book site
    - https://interpreterbook.com/
  why_this_one: 'The same journey in a different voice and a different language, at a gentler slope. Useful
    precisely when the primary source doesn''t land: hearing the second explanation of an environment
    chain is often what makes the first one make sense. Optional — nothing in the curriculum depends on
    it.'
  access_note: Paid, and genuinely optional. Skip it unless a Tier 1 explanation has failed you.
- key: tokenize
  title: 'Python: the tokenize module'
  url: https://docs.python.org/3/library/tokenize.html
  formats:
  - TOOL
  tier: 3
  group: Reference
  cite: Python documentation
  cost: free
  free: true
  links:
  - - docs.python.org
    - https://docs.python.org/3/library/tokenize.html
  why_this_one: A production lexer you can run against your own files (`python -m tokenize file.py`) and
    compare with yours. Its token kinds are a checklist of the cases a real language has to handle and
    a toy one gets to skip.
- key: pyast
  title: 'Python: the ast module'
  url: https://docs.python.org/3/library/ast.html
  formats:
  - TOOL
  tier: 3
  group: Reference
  cite: Python documentation
  cost: free
  free: true
  links:
  - - docs.python.org
    - https://docs.python.org/3/library/ast.html
  why_this_one: A real syntax tree to compare your node design against. `ast.dump(ast.parse("1 + 2 * 3"))`
    in the REPL is the fastest way to see how a grown-up language shapes the same tree you are building
    in Unit 2.
resource_tiers:
- num: 1
  name: Core path
  role: Worked through substantially, in curriculum order.
  compact: false
- num: 2
  name: Depth on demand
  role: A second voice on the same material, for when one explanation doesn't land.
  compact: false
- num: 3
  name: Reference
  role: Looked up in, not read.
  compact: true
phases:
- id: p0
  num: 0
  title: Orientation
  goal: Understand the shape of the pipeline before building any of it, and get a project skeleton that
    runs its own tests.
  entries:
  - u0
  weeks:
  - 0
  - 0
  checkpoint:
    prose: Something runs, even if it only echoes. You can name the three stages of the pipeline and say
      what each one hands to the next.
    track_goals:
    - - theory
      - you have met the phrase "regular language" and can say, roughly, what it rules out. Nothing here
        is deep yet — the point of Phase 0 is to have a place to put Unit 1.
- id: p1
  num: 1
  title: The front end
  goal: Turn source text into a syntax tree you can print, test, and trust. By the end of this phase nothing
    evaluates yet, but everything parses.
  entries:
  - u1
  - u2
  - m-errors
  weeks:
  - 1
  - 4
  checkpoint:
    prose: You can turn source text into a syntax tree and print it. You can explain, without hedging,
      why lexing and parsing are separate stages, and you can add a new binary operator at the right precedence
      in under five minutes.
    quiz: quiz-p1
    track_goals:
    - - theory
      - 'regular languages and context-free grammars are distinct in your head, and you can say which
        of your two stages needs which — and why that is a statement about power, not about style. A good
        sign that this has landed: you find yourself annoyed that the tree doesn''t *do* anything yet.
        That is Phase 2.'
- id: p2
  num: 2
  title: Making it run
  goal: Walk the tree and produce values. By the end of this phase tinylang is a language you can write
    small programs in.
  entries:
  - u3
  - u4
  weeks:
  - 5
  - 8
  checkpoint:
    prose: tinylang runs. You have written a lexer, a parser, and an evaluator, and you can explain what
      each stage is responsible for and how a change in one propagates through the others.
    track_goals:
    - - theory
      - 'you can state what your evaluator computes precisely enough that someone could disagree with
        it, which is the whole point of writing a semantics down. A good sign that this has landed: the
        next language you read the source of feels navigable, because you now know which file to open
        first.'
units:
- id: u0
  num: 0
  phase: p0
  title: Orientation
  rows:
  - label: Build
    content: 'Create the project skeleton — a `tinylang/` package, a `tests/` directory, and a single
      failing test. Wire up whatever runs your tests with one command. Then write `tinylang/repl.py`:
      read a line, echo it back, loop. It does nothing useful yet, and that is the point — you will replace
      its middle, once per phase, and watch the language grow.'
  - label: Read
    content: '[Crafting Interpreters](res:crafting), "A Map of the Territory" — the one chapter that shows
      the whole landscape at once. Skim, don''t study: you want the vocabulary (scanning, parsing, evaluating)
      and the sense that these are separable stages.'
  - label: Concepts
    content: why interpretation splits into stages at all; what a tree-walking interpreter is and what
      it gives up (speed) for what it buys (you can hold it in your head); source text → tokens → syntax
      tree → value as the through-line of the whole course.
  - label: Theory track
    content: 'start the ladder. What a *regular language* is, and the one-sentence version of why it is
      the right level of power for a lexer: no counting, no nesting, no memory beyond the current state.'
    track: theory
  - label: Milestone
    content: '`python -m tinylang.repl` starts, echoes, and exits cleanly on Ctrl-D; one test runs and
      passes.'
  gloss: Get a skeleton running and see the whole pipeline at cartoon level before building any stage
    of it.
  provenance: bespoke
  steps:
  - id: p0-skeleton
    label: Project skeleton with one passing test
  - id: p0-repl
    label: REPL echoes a line and exits cleanly
  - id: p0-map
    label: “A Map of the Territory” skimmed; the stages named
  check:
    q: A lexer and a parser both "read the input and produce structure." Why are they two stages instead
      of one?
    ans: Because they answer questions at different scales, and merging them means answering both at once
      in one grammar. The lexer works over characters and asks *what is this piece* — this run of digits
      is one number, this quote starts a string, this whitespace is nothing. The parser works over tokens
      and asks *how do these pieces relate* — this expression is the left operand of that operator. Splitting
      them means the parser never thinks about whitespace and the lexer never thinks about precedence.
      Unit 2 is where you feel the payoff.
- id: u1
  num: 1
  phase: p1
  title: Characters to tokens
  rows:
  - label: Build
    content: 'A hand-written lexer in `tinylang/lexer.py`. Scan a source string into a list of `Token(kind,
      text, line)`: numbers, strings, identifiers, keywords, operators, and a final `EOF`. Handle whitespace
      and `#` comments by skipping them. Report an unterminated string as an error that names the line,
      not as a crash.'
  - label: Read
    content: '[Crafting Interpreters](res:crafting), the "Scanning" chapter, all of it — it is the closest
      thing to a canonical treatment. Then look at [Python''s `tokenize` module](res:tokenize) output
      for a small Python file (`python -m tokenize somefile.py`) to see what a production lexer emits
      and how much more of it there is than you expected.'
  - label: Concepts
    content: lexeme vs. token vs. token kind; maximal munch, and why `<=` must be one token rather than
      two; why keywords are recognised *after* identifiers rather than during; the lookahead question
      — how far ahead must you peek, and why one character is almost always enough.
  - label: Theory track
    content: finish regular languages. Write the regular expression your number scanner is really implementing,
      then find the thing it cannot express — balanced parentheses — and notice that this is exactly the
      job you hand to the parser in [Unit 2](unit:u2).
    track: theory
  - label: Exercise
    content: Extend your lexer with a `--tokens` flag on the REPL that prints the token stream instead
      of evaluating. You will use it for debugging in every remaining unit, so make the output readable.
  - label: Milestone
    content: '`lex()` with tests over a fixture of tricky inputs — an empty string, a string containing
      a `#`, a number touching an operator (`1+2`), an unterminated string.'
  - label: Key insight
    content: 'A lexer is a state machine you happen to be writing as a loop with a `switch`. You have
      written this shape before, without the name — every protocol parser and every log-line splitter
      is the same animal. What the name buys you is the literature: once you call it a lexer, decades
      of accumulated technique become searchable.'
    kind: key
  gloss: Characters become tokens — a state machine you have written before, now with a name and a literature.
  provenance: bespoke
  depends_on:
  - u0
  load_bearing: true
- id: u2
  num: 2
  phase: p1
  title: Tokens to a tree
  rows:
  - label: Build
    content: 'A recursive-descent parser in `tinylang/parser.py` producing an AST: literals, unary and
      binary operations, grouping, and variable references. Implement precedence with Pratt parsing (a
      binding-power table) rather than one function per precedence level — it is fewer lines and it extends
      without restructuring. Add a `__repr__` on your nodes that prints the tree as parenthesised prefix
      notation, so `1 + 2 * 3` prints as `(+ 1 (* 2 3))` and a wrong precedence is visible at a glance.'
  - label: Read
    content: '[Crafting Interpreters](res:crafting), the "Parsing Expressions" chapter for the recursive-descent
      frame, then [Pratt Parsers: Expression Parsing Made Easy](res:pratt) for the binding-power technique
      that replaces its precedence cascade. Read them in that order — the second is an optimisation of
      the first, and it doesn''t land until you have felt the repetition it removes. [The Go interpreter
      book](res:interpreterbook) covers the same ground at book length if you want a second pass in another
      voice.'
  - label: Concepts
    content: grammars as a specification vs. code as an implementation; left- and right-associativity
      as a *choice*, expressed as a one-line asymmetry in binding power; why `1 + + 2` must be a syntax
      error and where in your code that decision lives; error recovery — synchronising to the next statement
      boundary so one mistake doesn't cascade into fifty.
  - label: Theory track
    content: context-free grammars. Write tinylang's expression grammar in BNF, then write the same grammar
      left-recursively and watch it hang your parser — the reason the textbook grammar and the implementable
      grammar differ is worth an hour.
    track: theory
  - label: Exercise
    content: '[The Unit 2 starter](mat:ex-u2) — a stub with failing tests over a fixture of expressions
      and their expected parenthesised forms. Make them pass, then point the same parser at the tokens
      coming out of [your lexer](repo:tinylang/lexer.py).'
  - label: Milestone
    content: Green tests; `1 + 2 * 3` and `(1 + 2) * 3` produce visibly different trees; a syntax error
      names the line and the offending token.
  gloss: Tokens become a tree, and precedence stops being a mystery once it is a table of binding powers.
  provenance: bespoke
  depends_on:
  - u1
  load_bearing: true
- id: u3
  num: 3
  phase: p2
  title: Walking the tree
  rows:
  - label: Build
    content: A tree-walking evaluator in `tinylang/interp.py`. Evaluate literals, arithmetic, comparison,
      and truthiness; add `let` bindings backed by an `Environment` that maps names to values. Wire it
      into the REPL so a typed expression prints its value. Delete the echo from Unit 0 — you have earned
      it.
  - label: Read
    content: '[Crafting Interpreters](res:crafting), the "Evaluating Expressions" and "Statements and
      State" chapters. Read the environment section twice: the chaining it introduces is what [Unit 4](unit:u4)
      turns into closures, and a fuzzy understanding here becomes a real bug there.'
  - label: Concepts
    content: the visitor pattern, and why a dispatch table or `match` is the same idea with less ceremony
      in Python; environments as a linked list of scopes rather than one flat dictionary; runtime errors
      vs. syntax errors, and why the two need different reporting paths; truthiness as a *language design
      decision* you are making, not a fact you are discovering.
  - label: Theory track
    content: semantics. Write down, in English precise enough to argue with, what your evaluator computes
      for a binary expression. You have just written a small-step operational semantics; the notation
      comes later, and it will look familiar when it does.
    track: theory
  - label: Exercise
    content: Add a `print` statement and string concatenation. Then find the smallest program that reveals
      whether your `Environment` chains correctly — a variable shadowed in an inner scope and read again
      in the outer one, in three lines.
  - label: Milestone
    content: The REPL evaluates arithmetic, comparisons, and `let` bindings across lines; an undefined
      variable produces a clean error naming the variable rather than a `KeyError` traceback.
  - label: Key insight
    content: The evaluator is smaller than the parser, and that surprises everybody. Nearly all the difficulty
      in a language front end is in deciding *what the program says*; once that is a tree, saying what
      it *means* is mostly recursion.
    kind: key
  gloss: The tree runs. Environments chain, and the evaluator turns out to be smaller than the parser.
  provenance: bespoke
  depends_on:
  - u2
  load_bearing: true
- id: u4
  num: 4
  phase: p2
  title: Functions and closures
  rows:
  - label: Build
    content: 'Function declarations, calls, and returns. Represent a function as a value that carries
      its own defining environment — that captured environment is the whole trick. Implement `return`
      by raising and catching a control-flow exception, then write a comment explaining why that is a
      legitimate technique rather than a hack. Verify the classic counter: a function that returns a function
      that increments a captured variable.'
  - label: Read
    content: '[Crafting Interpreters](res:crafting), the "Functions" and "Closures" chapters. If you have
      time for only one, take "Closures" slowly — it is the conceptual summit of this course.'
  - label: Concepts
    content: call frames and the environment stack; closures as "a function plus the environment it was
      born in"; why dynamic scope is easier to implement and almost always wrong; recursion falling out
      for free once functions can see their own name; the beginnings of tail calls, and why you are not
      doing them today.
  - label: Theory track
    content: close the ladder. State what a closure *is* semantically — a pair of a function body and
      an environment — and convince yourself that this one sentence explains both the counter exercise
      and every scoping bug you have ever shipped.
    track: theory
  - label: Exercise
    content: Write `make_counter` in tinylang itself and show that two counters made from the same factory
      are independent. If they share state, your closure is capturing the wrong environment — the failure
      is exactly the one [Unit 3](unit:u3) warned about.
  - label: Milestone
    content: '**Capstone.** A recursive `fib` and an independent-counters program both run under `python
      -m tinylang.repl < program.tl`. Write a paragraph on what your language cannot do — no classes,
      no modules, no error handling — and pick which one you would build next.'
  gloss: A function is a value that carries the environment it was born in — the conceptual summit, and
    the capstone.
  provenance: bespoke
  depends_on:
  - u3
  load_bearing: true
milestones:
- id: m-errors
  phase: p1
  kind: side-quest
  label: Error messages worth reading
  detail: Take one afternoon to make every error your front end can emit name a line, a column, and the
    offending token. Optional, and the highest ratio of quality-of-life to effort in the whole course
    — you are about to spend four weeks reading your own error messages.
  after_unit: u2
materials:
- id: lesson-u1
  kind: lesson
  title: Unit 1 — the lexer, Socratically
  path: interactive/lessons/unit-01-lexer.md
  unit: u1
  blurb: A guided conversation that builds the scanner loop by asking rather than telling.
- id: widget-u1
  kind: widget
  title: Token stream explorer
  path: interactive/widgets/token-stream.html
  unit: u1
  blurb: Type source, watch it split into tokens — including the cases that break a naive lexer.
- id: ex-u2
  kind: exercise
  title: Unit 2 starter — the Pratt parser
  path: interactive/exercises/unit-02-starter
  unit: u2
  grader:
    type: unit-test
    runner: python
    command: python -m unittest discover interactive/exercises/unit-02-starter
  blurb: A stub and a failing test suite over expressions and their expected trees.
- id: quiz-p1
  kind: quiz
  title: Phase 1 checkpoint quiz
  path: interactive/quizzes/phase-1-checkpoint.html
  phase: p1
  blurb: Eight questions on lexing and parsing, each with the reasoning shown after you answer.
- id: bank
  kind: question-bank
  title: Question Bank
  path: interactive/quizzes/question-bank.md
  blurb: The pool live quizzing draws from — recall, application, and explain-why, each with a teaching
    note.

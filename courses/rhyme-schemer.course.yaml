# Sidecar for the rhyme-schemer course (project-driven mode).
# Unit->material bindings transcribed from learning/build_site.py's UNITS dict,
# which this file supersedes as the structural source of truth.
sidecar_version: 1
course:
  id: rhyme-schemer
  title: "NLP & computational phonology, by finishing rhyme-schemer"
  mode: project
  hours_per_week: [3, 5]
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
    review: REVIEW.md
  capstone: u15
  coverage_ignore:
    - interactive/widgets/generate_sandbox_lexicon.py   # data generator, not a material

units:
  - id: u0
    num: 0
    phase_body: true
    gloss: "Tests green locally; the pipeline and the north star in your own words."
  - {id: u1, num: 1, gloss: "Phonemes, ARPAbet, and the CMU lexicon — sound, not spelling."}
  - {id: u2, num: 2, gloss: "The IPA vowel space as coordinates; feature distance as graded similarity."}
  - {id: u3, num: 3, gloss: "Consonants: place, manner, voicing, sonority — the parallel plane."}
  - {id: u4, num: 4, gloss: "Syllables and the Maximal Onset Principle."}
  - {id: u5, num: 5, gloss: "The vowel skeleton and the rhyme-bearing tail from the last stress."}
  - {id: u6, num: 6, gloss: "Perfect rhyme as the threshold-1.0 special case."}
  - {id: u7, num: 7, gloss: "Graded slant rhyme: the kernel's nucleus/coda weighting."}
  - {id: u8, num: 8, gloss: "Needleman-Wunsch over vowel skeletons: unequal-length tails."}
  - {id: u9, num: 9, gloss: "Multi-word spans and pronunciation variants."}
  - {id: u10, num: 10, gloss: "Rhyme groups as connected components; transitivity imposed on a relation that lacks it."}
  - id: u11
    num: 11
    gloss: "Scanning a verse for internal and multisyllabic rhyme."
    note: >
      This unit's guide is the scanner walkthrough — written during the
      collaborative build, warts and wrong turns included, and it contains the
      project's living open tuning ledger. The Markdown file in
      interactive/lessons/ remains the engineering-canonical copy that code
      comments cite.
  - {id: u12, num: 12, gloss: "Rendering the scheme: color by rhyme class."}
  - {id: u13, num: 13, gloss: "Out-of-vocabulary words and the G2P fallback chain."}
  - {id: u14, num: 14, gloss: "Evaluation: gold annotation, corpora-first ground truth."}
  - {id: u15, num: 15, gloss: "Capstone: the finished tool plus the written understanding."}

materials:
  # Lessons
  - {id: l-u01, kind: lesson, title: "Phonemes, not spelling", path: interactive/lessons/unit-01-phonemes-not-spelling.md, unit: u1}
  - {id: l-u02, kind: lesson, title: "Feature distance", path: interactive/lessons/unit-02-feature-distance.md, unit: u2}
  - {id: l-u03, kind: lesson, title: "Consonants", path: interactive/lessons/unit-03-consonants.md, unit: u3}
  - {id: l-u04, kind: lesson, title: "Syllables & phonotactics", path: interactive/lessons/unit-04-syllables-and-phonotactics.md, unit: u4}
  - {id: l-u05, kind: lesson, title: "The rhyme tail", path: interactive/lessons/unit-05-rhyme-tail.md, unit: u5}
  - {id: l-u06, kind: lesson, title: "Perfect rhyme first", path: interactive/lessons/unit-06-perfect-rhyme.md, unit: u6}
  - {id: l-u07, kind: lesson, title: "The rhyme kernel", path: interactive/lessons/unit-07-the-rhyme-kernel.md, unit: u7}
  - {id: l-u08, kind: lesson, title: "Alignment", path: interactive/lessons/unit-08-alignment.md, unit: u8}
  - {id: l-u09, kind: lesson, title: "Variants and spans", path: interactive/lessons/unit-09-variants-and-spans.md, unit: u9}
  - {id: l-u10, kind: lesson, title: "Non-transitivity", path: interactive/lessons/unit-10-non-transitivity.md, unit: u10}
  - {id: l-u11, kind: lesson, title: "Scanner walkthrough & tuning ledger", path: interactive/lessons/unit-11-scanner-walkthrough.md, unit: u11}
  - {id: l-u12, kind: lesson, title: "Rendering", path: interactive/lessons/unit-12-rendering.md, unit: u12}
  - {id: l-u13, kind: lesson, title: "G2P", path: interactive/lessons/unit-13-g2p.md, unit: u13}
  # Companions (on-ramps)
  - {id: c-phonetics, kind: companion, title: "How speech works: a phonetics refresher", path: interactive/lessons/phonetics-primer.md, also_units: [u1]}
  - {id: c-alignment, kind: companion, title: "The sequence-alignment family", path: interactive/lessons/sequence-alignment-family.md, also_units: [u8]}
  - {id: c-graphs, kind: companion, title: "Graphs, components, and union-find from zero", path: interactive/lessons/graphs-and-union-find.md, also_units: [u10]}
  # Widgets
  - {id: w-vowel, kind: widget, title: "Vowel-Space Explorer", path: interactive/widgets/vowel-explorer.html, unit: u2}
  - {id: w-consonant, kind: widget, title: "Consonant-Space Explorer", path: interactive/widgets/consonant-explorer.html, unit: u3}
  - {id: w-syllabifier, kind: widget, title: "Syllabifier", path: interactive/widgets/syllabifier.html, unit: u4}
  - {id: w-sandbox, kind: widget, title: "Rhyme-Score Sandbox", path: interactive/widgets/rhyme-score-sandbox.html, unit: u7, also_units: [u9]}
  - {id: w-nw, kind: widget, title: "NW Alignment Explorer", path: interactive/widgets/nw-alignment.html, unit: u8}
  - {id: w-grouping, kind: widget, title: "Grouping Explorer", path: interactive/widgets/grouping-explorer.html, unit: u10}
  - {id: w-annotator, kind: widget, title: "Gold Annotator", path: interactive/widgets/gold-annotator.html, unit: u14}
  # Quizzes
  - {id: q-phase-1, kind: quiz, title: "Phase 1 checkpoint", path: interactive/quizzes/phase-1-checkpoint.html, phase_num: 1}
  - {id: q-phase-2, kind: quiz, title: "Phase 2 checkpoint", path: interactive/quizzes/phase-2-checkpoint.html, phase_num: 2}
  - {id: q-phase-3, kind: quiz, title: "Phase 3 checkpoint", path: interactive/quizzes/phase-3-checkpoint.html, phase_num: 3}
  - {id: q-phase-4, kind: quiz, title: "Phase 4 checkpoint", path: interactive/quizzes/phase-4-checkpoint.html, phase_num: 4}
  - {id: b-questions, kind: question-bank, title: "Question bank", path: interactive/quizzes/question-bank.md}
  # Exercises — graders per each exercise's own test style; the repo's suite
  # is the real grader in project-driven mode.
  - id: x-u05
    kind: exercise
    title: "unit-05-rhyme-tail"
    path: interactive/exercises/unit-05-rhyme-tail
    unit: u5
    grader: {type: unit-test, runner: python-unittest}
  - id: x-u08
    kind: exercise
    title: "unit-08-alignment"
    path: interactive/exercises/unit-08-alignment
    unit: u8
    grader: {type: unit-test, runner: python-unittest}
  - id: x-u10
    kind: exercise
    title: "unit-10-grouping"
    path: interactive/exercises/unit-10-grouping
    unit: u10
    grader: {type: unit-test, runner: python-unittest}
  - id: x-u13
    kind: exercise
    title: "unit-13-g2p-extension"
    path: interactive/exercises/unit-13-g2p-extension
    unit: u13
    grader: {type: unit-test, runner: python-unittest}

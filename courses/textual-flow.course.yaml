  why_this_one: "Simulation-first Bayesian statistics for exactly your kind of mind; chs. 1–2 + lectures before Unit 13 if posteriors feel like folklore. His style is your Phase 3 instinct applied to statistics."
  access_note: "**Lectures are free** (2023 playlist is complete; a 2026 series tracks the 3rd-edition drafts); the book is optional at this course's depth."

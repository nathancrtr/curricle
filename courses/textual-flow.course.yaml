  - ["DSH 2024 (McCollum & Turnbull)", "https://academic.oup.com/dsh/article/39/1/258/7477852"]
  why_this_one: "The state of the art on *real* data, and (explicitly) what it lacks: ground truth — your Unit-13 foil. The 2024 paper is the worked example of BEAST-on-collation you'll follow."
  access_note: "**Paywalled at OUP** — check the authors' pages for green OA copies before paying."
- key: mcelreath
  tier: 2
  title: "Statistical Rethinking"

resource_tiers:
- num: 1
  name: "The core path"
  role: "Worked through substantially, in curriculum order. These ten are the course's spine — the meter above tracks them."
- num: 2
  name: "Supplementary & deepening"
  role: "Pulled in on demand — when a write-up needs a citation anchor, a concept needs a second angle, or the price of a Tier-1 item wins."
- num: 3
  name: "Data, tools & reference"
  compact: true
  role: "Looked up in, not read. Licenses noted — they matter to what the program may publish."
- num: 4
  name: "Video & audio"
  role: "Where video genuinely helps — language habit-forming and statistics lectures."
units:
- id: u0
  num: 0
  phase_body: true
  gloss: Make open-cbgm run on 3 John, skim the map of the field, start the alphabet — and say in one paragraph
    where the humans sit in the pipe.
  steps:
  - id: p0-run
    label: open-cbgm built & run on 3 John, every output eyeballed
  - id: p0-read
    label: W&G front matter + fast skim; README + REVIEW read
  - id: p0-para
    label: 'Milestone paragraph: in, out, where the humans sit'
- id: u1
  num: 1
  gloss: Parse the ECM's TEI into your own data model — and meet the apparatus as a sparse matrix with an opinionated
    schema.
- id: u2
  num: 2
  gloss: Percent agreement over jointly extant units — the pure-similarity layer that deliberately claims no direction.
- id: u3
  num: 3
  gloss: Thousands of per-unit directed judgments aggregate into witness-level ancestry — and one flipped arrow
    can make a tie.
- id: u4
  num: 4
  gloss: Flow diagrams, the connectivity prior, and the reconstructed witness A — where the editors' dials live.
- id: u5
  num: 5
  gloss: The critics read closely, both sides at full strength — and every testable claim goes into dispute.md.
- id: u6
  num: 6
  gloss: The 2020 counterexample, encoded as TEI and re-run — dormant six years, now executable.
- id: u7
  num: 7
  gloss: What the wider field learned about validating methods on artificial traditions — and the simulator's design
    doc.
- id: u8
  num: 8
  gloss: A birth–death copying process that produces manuscript traditions with their true history attached.
- id: u9
  num: 9
  gloss: Copying errors create readings; the oracle editor reports the truth corrupted at rate ε — one parameter,
    three studies.
- id: u10
  num: 10
  gloss: 'Synthetic tradition → TEI → open-cbgm → scored against truth: one command, and the machine the papers
    come from.'
- id: u11
  num: 11
  gloss: Block and per-reading mixture, with every event recorded — simulate the thing the method claims to survive.
- id: u12
  num: 12
  gloss: 'The sweep: how often, and how badly, does the potential-ancestor criterion misorder Carlson-type witnesses?'
- id: u13
  num: 13
  gloss: BEAST and NeighborNet on the same synthetic traditions — three method families scored on identical truth.
- id: u14
  num: 14
  gloss: 'Paper #1: calibration, the measured bias, contamination limits — and what it does and doesn''t say about
    the NT.'
- id: u15
  num: 15
  gloss: 'Scripted perturbation of the real inputs: stemma flips, connectivity sweeps, witness and unit bootstraps.'
- id: u16
  num: 16
  gloss: 'Four stability metrics, one table: dial turned → what moves, how much — read the fragile units in Greek.'
- id: u17
  num: 17
  gloss: 'If INTF said yes: Acts, Mark, Revelation (~17,500 more units). If not: deepen 3 John and document the
    constraint honestly.'
  condition:
    "on": INTF licensing answer
    state: pending
- id: u18
  num: 18
  gloss: 'Paper #2: how robust is the ECM text to its editors'' judgments — framed by paper #1''s calibration.'
- id: u19
  num: 19
  gloss: Twenty local stemmata built by hand, before looking at the editors' — your own ε, measured.
- id: u20
  num: 20
  gloss: Dataset built, labels shuffled, the trivial-star floor computed, memorization probed — the traps built
    out before the run.
- id: u21
  num: 21
  gloss: The prompted runs across three evidence conditions, scored — and the disagreement taxonomy that is the
    study's heart.
- id: u22
  num: 22
  gloss: 'Paper #3 with its baselines and floors, then PROGRAM.md: what do we now know that nobody knew two years
    ago?'
milestones:
- id: p2-mail
  phase_num: 2
  kind: contact
  after_unit: u7
  label: '📮 Contact milestone: INTF + McCollum emails sent'
  detail: 'Two emails at end of Phase 2: INTF/Munster re reuse/publication terms; Joey McCollum intro. Drafts with
    Claude; sending is the learner''s own act.'

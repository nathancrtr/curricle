sidecar_version: 1
course:
  id: textual-flow
  title: Textual criticism & computational philology
  mode: research
  hours_per_week:
  - 3
  - 5
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
    review: REVIEW.md
    exploration: exploration/
  capstone: u22
  storage_key: tf-progress
  resources_intro: >-
    **Tier 1** is the core path — worked through substantially, in curriculum
    order. **Tier 2** deepens and fills gaps on demand. **Tier 3** is data,
    tools, and reference — looked up in, not read. **Tier 4** is video & audio.
    Each entry says *why this one* and what access costs; mark a resource
    "in hand" once your copy or access is sorted, and keep loan dates or
    purchase notes on the entry itself. The unavoidable paid core is **≈ $120**
    (Wasserman & Gurry + the Mink volume + Decker) — everything else has a free
    path or a library workaround.
  reading_order:
  - "Wasserman & Gurry (fast skim, then chapter-by-chapter through Phase 1)"
  - "Parker, selectively (alongside Unit 1)"
  - "Mink, pass 1 (Unit 3) — with the Genealogical Queries guide + live tool"
  - "Gurry's *Critical Examination* + Mink pass 2 + the Carlson/Mink exchange (Phase 2)"
  - "Handbook of Stemmatology ch. 5 + the Camps papers (Phases 2–3)"
  - "Taming the BEAST + McCollum & Turnbull (+ McElreath as needed) (Phase 4)"
  - "Royse + Metzger's *Commentary* + Willker (Phase 6)"
  - "Greek: Decker continuously from week 0; STEP Bible from Phase 3; Wallace from Phase 5"
  description: 'Learn New Testament textual criticism and computational philology by building a simulation & sensitivity
    laboratory for the CBGM — with Koine Greek alongside, start to finish.

    '
  trigger_phrases:
  - say: Teach me Unit 2 interactively.
    note: Socratic lessons exist for units 1, 2, 3, 4, 6, 8, 19; any other unit gets improvised from the curriculum.
  - say: Quiz me on Phase 1.
    note: live quizzing from the question bank, wrong answers taught, not just marked.
  - say: Drill me on Greek.
    note: alphabet rounds now; paradigms, parsing, and translate-checks as Decker advances.
  - say: Review my Unit 7 design doc — tear it apart.
  - say: My numbers disagree with open-cbgm. Help me find who's wrong.
  - say: Draft the INTF email with me.
    note: the Phase 2 contact milestone (drafting together; sending is yours).
tracks:
- id: greek
  name: Koine Greek
  cadence: 1.5-2 hrs/wk, near-daily
  stages:
  - id: g-alpha
    label: alphabet
  - id: g-nouns
    label: nouns & articles
  - id: g-verbs
    label: verbs arrive
  - id: g-1john
    label: reading 1 John
  - id: g-app
    label: apparatus literate
  - id: g-mark
    label: Mark with helps
  row_labels:
  - Greek track
  checkpoint_labels:
  - Greek by now
resources:
- key: wg
  tier: 1
  group: "Textual criticism & the CBGM"
  title: "A New Approach to Textual Criticism: An Introduction to the CBGM"
  cite: "Wasserman & Gurry · SBL Press · 2017"
  formats: [TEXT]
  cost: "paid ~$20"
  free: false
  links:
  - ["SBL Press", "https://cart.sbl-site.org/books/060399P"]
  why_this_one: "The standard gentle on-ramp to the CBGM, written by a sympathetic critic (Gurry) and a practitioner (Wasserman) — ~100 pages, readable in two sittings, and the only book-length introduction that exists. The whole of Phases 0–1 hangs off it."
  access_note: "**Buy it** — cheap enough to purchase without thinking; used copies are common."
- key: mink
  tier: 1
  group: "Textual criticism & the CBGM"
  title: "“Contamination, Coherence, and Coincidence in Textual Transmission”"
  cite: "Gerd Mink · in Wachtel & Holmes (eds.), The Textual History of the Greek New Testament, pp. 141–216 · SBL Text-Critical Studies 8 · 2011"
  formats: [TEXT]
  cost: "paid $37 pbk"
  free: false
  links:
  - ["SBL Press", "https://cart.sbl-site.org/books/067008P"]
  why_this_one: "The primary source — the method from its inventor, in its fullest methodological statement. Dense; the curriculum schedules three passes (definitions → worked examples → adversarial)."
  access_note: "**Not open access** — only the front matter is free. The $37 paperback buys the rest of the volume's status-quaestionis essays too."
- key: gurry
  tier: 1
  group: "Textual criticism & the CBGM"
  title: "A Critical Examination of the CBGM"
  cite: "Peter Gurry · Brill, NTTSD 55 · 2017"
  formats: [TEXT]
  cost: "paid — expensive"
  free: false
  links:
  - ["Brill", "https://brill.com/display/title/35755"]
  - ["Free summary article (PDF)", "https://www.wisluthsem.org/rmdevser_wls/wp-content/uploads/2024/11/Gurry_Article-1.pdf"]
  why_this_one: "The deepest critical treatment — sympathetic but unsparing on editor-dependence, the initial-text concept, and contamination handling; also the source of the “what did the CBGM actually change” counts your write-ups will cite."
  access_note: "**Brill pricing is hostile** — interlibrary loan is the move, or lean on the free summary article (also listed in Tier 2) if the price wall wins."
- key: carlson
  tier: 1
  group: "Textual criticism & the CBGM"
  title: "“A Bias at the Heart of the CBGM” + Mink's reply"
  cite: "Stephen Carlson · JBL 139.2 (2020): 319–340 — with Gerd Mink's guest-post response · INTF blog · 2020"
  formats: [PAPER]
  cost: "free"
  free: true
  links:
  - ["Open copy (ACU repository)", "https://acuresearchbank.acu.edu.au/item/8wx32/a-bias-at-the-heart-of-the-cbgm"]
  - ["Mink's reply (INTF blog)", "https://ntvmr.uni-muenster.de/intfblog/-/blogs/remarks-on-carlson-a-bias-at-the-heart-of-the-cbgm-guest-post-by-gerd-mink-"]
  why_this_one: "The dispute your simulation study adjudicates, in both principals' own words. Unit 6 reproduces the paper's counterexample in code; read both slowly, together."
  access_note: "**Free** — the JBL article via ACU's repository, the reply on the INTF blog."
- key: parker
  tier: 1
  group: "Textual criticism & the CBGM"
  title: "An Introduction to the New Testament Manuscripts and Their Texts"
  cite: "D.C. Parker · Cambridge UP · 2008"
  formats: [TEXT]
  cost: "paid ~$40–50 pbk"
  free: false
  links:
  - ["Cambridge", "https://www.cambridge.org/core/books/an-introduction-to-the-new-testament-manuscripts-and-their-texts/68450BA1F41A6C2C4023E9BDF52D8898"]
  why_this_one: "The material-culture grounding the CBGM literature assumes — what manuscripts physically are, how editions get made, how the discipline thinks. Read selectively (Parts I–II) in Phase 1; return whenever the data feels abstract."
  access_note: "**Paperback or library** — read selectively, so a loan works fine."
- key: handbook
  tier: 1
  group: "Stemmatology & simulation"
  title: "Handbook of Stemmatology"
  cite: "ed. Roelli · De Gruyter · 2020"
  formats: [TEXT]
  cost: "free — open access"
  free: true
  links:
  - ["Open access (CC BY)", "https://www.degruyterbrill.com/document/doi/10.1515/9783110684384/html"]
  why_this_one: "The field's canonical reference, free — ch. 5 (computational methods) and the evaluation/artificial-traditions material are Phases 2–3's theoretical backbone. Treat the rest as encyclopedia."
  access_note: "**Free, CC BY.** Host moved: De Gruyter → degruyterbrill.com (the link is current)."
- key: camps
  tier: 1
  group: "Stemmatology & simulation"
  title: "“Lost Manuscripts and Extinct Texts” + “On the Transmission of Texts”"
  cite: "Camps & Randon-Furling · arXiv · 2022 / 2025"
  formats: [PAPER]
  cost: "free"
  free: true
  links:
  - ["arXiv:2210.16577", "https://arxiv.org/abs/2210.16577"]
  - ["arXiv:2505.19246", "https://arxiv.org/abs/2505.19246"]
  why_this_one: "The published template for your Unit-8 generator — birth–death copying with loss, calibrated to real traditions. The nearest thing to a spec for `simulate/`."
  access_note: "**Free** — both on arXiv."
- key: decker
  tier: 1
  group: "Greek — the continuous track"
  title: "Reading Koine Greek: An Introduction and Integrated Workbook"
  cite: "Rodney Decker · Baker Academic · 2014"
  formats: [TEXT]
  cost: "paid ~$55–65"
  free: false
  links:
  - ["Baker eSources (free audio, flashcards)", "https://bakeracademic.com/pages/decker-reading-koine-greek-esources"]
  why_this_one: "The most linguistically literate of the standard grammars — verbal aspect handled the way a linguistics BA wants it handled, reading-focused, LXX + NT examples from the start, exercises integrated. 33 chapters ≈ the first 8–9 months of the track at one/week."
  access_note: "**Buy it** — this is the daily companion for most of a year. The eSources page (audio, flashcards) is free."
- key: step
  tier: 1
  group: "Greek — the continuous track"
  title: "STEP Bible"
  cite: "Tyndale House"
  formats: [DATA]
  cost: "free"
  free: true
  links:
  - ["stepbible.org", "https://www.stepbible.org/"]
  why_this_one: "Tagged Greek text with instant morphology/gloss on click — the reading scaffold that makes 1 John attackable at Decker-ch.-20 Greek. Your daily reading tool from Phase 3 on."
  access_note: "**Free**, in the browser."
- key: metzger
  tier: 1
  group: "Greek — the continuous track"
  title: "A Textual Commentary on the Greek New Testament"
  cite: "Bruce Metzger · 2nd ed., 1994 · current printing Deutsche Bibelgesellschaft · ISBN 9783438060105"
  formats: [TEXT]
  cost: "paid ~$40–60"
  free: false
  url: "urn:isbn:9783438060105"
  why_this_one: "The committee's variant-by-variant reasoning — Phase 6's worked-example set for transcriptional judgment. You'll adjudicate first, then read Metzger, every time."
  access_note: "**No stable URL** — find by ISBN at the German Bible Society, Amazon, or Logos. Not needed until Phase 6, so no rush."
- key: royse
  tier: 2
  title: "Scribal Habits in Early Greek New Testament Papyri"
  cite: "James Royse · SBL paperback reprint"
  formats: [TEXT]
  cost: "paid $92 — ouch"
  free: false
  links:
  - ["SBL Press", "https://cart.sbl-site.org/books/069551P"]
  why_this_one: "The empirical demolition of *lectio brevior* and the deepest study of what scribes actually do; Phase 6's spine."
  access_note: "**Library first** — the summary chapter + one papyrus chapter suffice if the price stings."
- key: myths
  tier: 2
  title: "Myths and Mistakes in New Testament Textual Criticism"
  cite: "Hixson & Gurry (eds.) · IVP Academic · 2019"
  formats: [TEXT]
  cost: "paid ~$25–40"
  free: false
  links:
  - ["IVP", "https://www.ivpress.com/myths-and-mistakes-in-new-testament-textual-criticism"]
  why_this_one: "Calibration on effect sizes and popular overclaims, from the field's younger generation; fast, honest, useful for write-up framing."
  access_note: "**Affordable** — used copies common."
- key: hmf
  tier: 2
  title: "“Comparative computational textual criticism of the Gospel of Mark” + McCollum & Turnbull's BEAST worked example"
  cite: "Hyytiäinen, McCollum & Finney · DSH 41.2 · 2026 — and McCollum & Turnbull · DSH 39.1 · 2024"

# The only file that names models or prices (tier indirection — roles and
# code say cheap/frontier/premium). Prices are USD per million tokens,
# Anthropic first-party API rates as of 2026-08-28; cache write ≈ 1.25x
# input, cache read ≈ 0.1x input. A vendor price change is an edit here,
# not a release.
tiers:
  cheap: claude-haiku-4-5
  frontier: claude-sonnet-5
  premium: claude-opus-5

prices:
  claude-opus-5:    {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
  claude-sonnet-5:  {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-haiku-4-5: {input: 1.00, output:  5.00, cache_write: 1.25, cache_read: 0.10}

# Which tier each factory role runs on. Generation quality is the product;
# start everything on premium and tune down with evidence, not hope.
roles:
  lesson-writer: premium
  quiz-author: premium
  exercise-author: premium
  widget-builder: premium
  bank-author: premium

# USD budget per tenant per stage (stage = role name). The runner refuses
# a call once the ledger shows the stage's spend at or beyond its budget.
budgets:
  default: 5.00

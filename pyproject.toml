[project]
name = "curricle"
version = "0.1.0"
description = "Manifest layer of a personalized-learning platform: course schema + compiler over the learning-track corpus conventions"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[tool.setuptools]
packages = ["curricle"]

[project]
name = "curricle"
version = "0.1.0"
description = "A personalized-learning platform for one person: compile a course from markdown, serve it with progress tracking, and let an LLM build its interactive layer under a budget"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[tool.setuptools]
packages = ["curricle"]
